function renderTabs(){const a=all();$('#psel').innerHTML=STRUCT.map(p=>{const l=a.filter(x=>x.p.id===p.id),c=counts(l);return `<option value="${p.id}" ${p.id===palo?'selected':''}>${esc(p.n)} · ${c.lista+c.borrador}/${l.length}</option>`}).join('');document.documentElement.style.setProperty('--ac',PCOL(palo))}
function renderTree(){
 const p=STRUCT.find(p=>p.id===palo),qq=norm(q);
 $('#tree').innerHTML=famsOf(p).map(f=>{
  const fk=p.id+'/'+f.id;const list=f.items.map(it=>({key:fk+'/'+it.id,it,p,f}));const c=counts(list);
  const vis=list.filter(x=>(filtro==='todos'||st(x.key)===filtro)&&(!soloB||isB(x.key))&&(!qq||norm(x.it.n+' '+(x.it.d||'')).includes(qq)));
  if(!vis.length&&(filtro!=='todos'||qq||soloB))return '';
  const open=!closed.has(fk)||qq||filtro!=='todos'||soloB;
  return `<div class="fam" data-open="${open?1:0}"><button class="famh" type="button" data-fam="${fk}" aria-expanded="${open}"><span class="tw">▾</span><b>${esc(f.n)}</b><span>${c.lista+c.borrador}/${list.length}</span></button>
<ul class="items">${vis.map(x=>`<li><button class="it" type="button" data-k="${x.key}" aria-current="${sel===x.key}"><span class="dot ${st(x.key)}" title="${ST_LAB[st(x.key)]}"></span><span>${esc(x.it.n)}</span>${isB(x.key)?'<span class="bas" title="Básico" aria-label="básico">★</span>':''}${x.it.e?`<em>${esc(x.it.e)}</em>`:''}</button></li>`).join('')}
<li><button class="add" type="button" data-addto="${fk}">+ Añadir estilo o variante</button></li></ul></div>`}).join('')||'<p class="desc">Nada coincide con el filtro.</p>';
}

/* ---- MusicXML (MuseScore) → ABC ---- */
const KEYN=['Cb','Gb','Db','Ab','Eb','Bb','F','C','G','D','A','E','B','F#','C#'];
const KEYM=['Abm','Ebm','Bbm','Fm','Cm','Gm','Dm','Am','Em','Bm','F#m','C#m','G#m','D#m','A#m'];
const SHARPS='FCGDAEB',FLATS='BEADGCF';
function kids(el,tag){return el?[...el.children].filter(c=>c.tagName===tag):[]}
function kid(el,tag){return kids(el,tag)[0]||null}
function txt(el,tag){const k=tag?kid(el,tag):el;return k?k.textContent.trim():''}
function gcd(a,b){return b?gcd(b,a%b):a}
function lenStr(n,d){if(n<=0)return '';const g=gcd(n,d);n/=g;d/=g;if(d===1)return n===1?'':String(n);return (n===1?'':n)+'/'+d}
function mx2abc(doc){
 const root=doc.documentElement||doc;const parts=kids(root,'part');if(!parts.length)throw new Error('No encuentro ninguna parte en el archivo.');
 const listNames=kids(kid(root,'part-list'),'score-part').map(sp=>({id:sp.getAttribute('id'),n:txt(sp,'part-name').toLowerCase()}));
 const pref=listNames.find(p=>/voz|voice|cante|canto|vocal|soprano|flaut|flute|melod/.test(p.n));
 const part=(pref&&parts.find(p=>p.getAttribute('id')===pref.id))||parts[0];
 const title=txt(kid(root,'work'),'work-title')||txt(kid(root,'movement-title'));
 let div=1,fifths=0,mode='major',meter='',tempo=0,keyAcc={},head=null;const bars=[];let lyr=[],harm='';
 const keyAccOf=f=>{const a={};for(let i=0;i<Math.abs(f);i++)a[(f>0?SHARPS:FLATS)[i]]=f>0?1:-1;return a};
 for(const m of kids(part,'measure')){
  let out=[],barAcc={};
  for(const el of [...m.children]){
   const tg=el.tagName;
   if(tg==='attributes'){const d=txt(el,'divisions');if(d)div=+d;const k=kid(el,'key');if(k){fifths=+txt(k,'fifths')||0;mode=(txt(k,'mode')||'major').toLowerCase();keyAcc=keyAccOf(fifths);if(head)out.push(`[K:${mode==='minor'?KEYM[fifths+7]:KEYN[fifths+7]}]`)}const t=kid(el,'time');if(t){const b=txt(t,'beats'),bt=txt(t,'beat-type');if(b&&bt){if(head)out.push(`[M:${b}/${bt}]`);else meter=b+'/'+bt}}}
   else if(tg==='direction'){const s=kid(el,'sound');const pm=el.getElementsByTagName?el.getElementsByTagName('per-minute')[0]:null;if(!tempo){if(s&&s.getAttribute('tempo'))tempo=Math.round(+s.getAttribute('tempo'));else if(pm)tempo=Math.round(+pm.textContent)}}
   else if(tg==='sound'&&el.getAttribute('tempo')&&!tempo){tempo=Math.round(+el.getAttribute('tempo'))}
   else if(tg==='harmony'){const r=kid(el,'root');if(r){const step=txt(r,'root-step'),alt=+txt(r,'root-alter')||0;const kd=kid(el,'kind');const kt=kd?(kd.getAttribute('text')||''):'';const kn=kd?kd.textContent.trim():'';
     const suf=kt||({minor:'m','minor-seventh':'m7',dominant:'7','major-seventh':'maj7',diminished:'dim',augmented:'+','half-diminished':'m7b5','suspended-fourth':'sus4'}[kn]||'');harm=step+(alt>0?'#':alt<0?'b':'')+suf}}
   else if(tg==='note'){
    if(kid(el,'grace')||kid(el,'chord'))continue;const v=txt(el,'voice');if(v&&v!=='1')continue;
    const dur=+txt(el,'duration')||0;if(!dur)continue;
    const n16=dur*4,d16=div;const L=lenStr(n16,d16);
    const ch=harm?`"${harm}"`:'';harm='';
    if(kid(el,'rest')){out.push(ch+'z'+L);continue}
    const p=kid(el,'pitch');if(!p)continue;const step=txt(p,'step'),alt=Math.round(+txt(p,'alter')||0),oct=+txt(p,'octave');
    const bk=step+oct;const cur=barAcc[bk]??keyAcc[step]??0;let acc='';if(alt!==cur){acc={'-2':'__','-1':'_','0':'=','1':'^','2':'^^'}[String(alt)]||'';barAcc[bk]=alt}
    let nm=oct>=5?step.toLowerCase()+"'".repeat(oct-5):step+','.repeat(Math.max(0,4-oct));
    const ties=kids(el,'tie').map(t=>t.getAttribute('type'));const tieStart=ties.includes('start');
    out.push(ch+acc+nm+L+(tieStart?'-':''));
    for(const ly of kids(el,'lyric')){const t=txt(ly,'text');if(t){const sy=txt(ly,'syllabic');lyr.push(t+(sy==='begin'||sy==='middle'?'-':' '))}break}
   }
  }
  if(!head){head=true}
  bars.push(out.join(' '));
 }
 const key=mode==='minor'?KEYM[fifths+7]:KEYN[fifths+7];
 let body='';bars.forEach((b,i)=>{body+=b+(i===bars.length-1?' |]':' |')+((i+1)%4===0&&i<bars.length-1?'\n':' ')});
 const abc=`X:1\nT:${title}\nM:${meter||'4/4'}\nL:1/16\nQ:1/4=${tempo||80}\nK:${key}\n${body.trim()}\n`;
 const letra=lyr.join('').replace(/- /g,'').replace(/\s+/g,' ').trim();
 return {abc,letra};
}
/* lee .mxl (zip) o .musicxml/.xml y devuelve el texto XML */
async function readScoreFile(file){
 const buf=new Uint8Array(await file.arrayBuffer());
 if(!(buf[0]===0x50&&buf[1]===0x4b))return new TextDecoder().decode(buf);
 const dv=new DataView(buf.buffer);let eocd=-1;for(let i=buf.length-22;i>=0&&i>buf.length-70000;i--)if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}
 if(eocd<0)throw new Error('El .mxl parece dañado.');
 const cnt=dv.getUint16(eocd+10,true);let off=dv.getUint32(eocd+16,true);const ents=[];const dec=new TextDecoder();
 for(let k=0;k<cnt;k++){const method=dv.getUint16(off+10,true),csize=dv.getUint32(off+20,true),nlen=dv.getUint16(off+28,true),xlen=dv.getUint16(off+30,true),clen=dv.getUint16(off+32,true),loff=dv.getUint32(off+42,true);ents.push({name:dec.decode(buf.slice(off+46,off+46+nlen)),method,csize,loff});off+=46+nlen+xlen+clen}
 const get=async e=>{const ln=dv.getUint16(e.loff+26,true),lx=dv.getUint16(e.loff+28,true);const data=buf.slice(e.loff+30+ln+lx,e.loff+30+ln+lx+e.csize);if(e.method===0)return dec.decode(data);if(e.method!==8||typeof DecompressionStream==='undefined')throw new Error('Este navegador no abre .mxl: exporta en MusicXML sin comprimir (.musicxml).');const s=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return await new Response(s).text()};
 let target=null;const cont=ents.find(e=>e.name==='META-INF/container.xml');
 if(cont){const m=/full-path="([^"]+)"/.exec(await get(cont));if(m)target=ents.find(e=>e.name===m[1])}
 if(!target)target=ents.find(e=>/\.(musicxml|xml)$/i.test(e.name)&&!e.name.startsWith('META-INF'));
 if(!target)throw new Error('No encuentro la partitura dentro del .mxl.');
 return await get(target);
}

/* ---- ABC → notas para el reproductor ---- */
const MAJ={C:0,G:1,D:2,A:3,E:4,B:5,'F#':6,'C#':7,F:-1,Bb:-2,Eb:-3,Ab:-4,Db:-5,Gb:-6,Cb:-7};
const MODE={'':0,maj:0,ion:0,mix:-1,dor:-2,m:-3,min:-3,aeo:-3,phr:-4,loc:-5,lyd:1};
function keySig(k){const m=/^\s*([A-G])([#b]?)\s*([A-Za-z]*)/.exec(k||'');const acc={};if(!m)return acc;let n=MAJ[m[1]+m[2]];if(n===undefined)return acc;const md=m[3].toLowerCase();n+=MODE[md.startsWith('m')&&md.length<=3&&md!=='mix'?(md==='maj'?'maj':'m'):md.slice(0,3)]??0;
 if(n>0)'FCGDAEB'.slice(0,Math.min(n,7)).split('').forEach(l=>acc[l]=1);if(n<0)'BEADGCF'.slice(0,Math.min(-n,7)).split('').forEach(l=>acc[l]=-1);return acc}
function frac(s,def){const m=/(\d+)\s*\/\s*(\d+)/.exec(s||'');return m?(+m[1])/(+m[2]):def}
function parseABC(src){
 const lines=src.split(/\r?\n/);let L=null,M='4/4',key={},qbpm=90,body=[];
 for(const ln of lines){const h=/^([A-Za-z]):\s*(.*)$/.exec(ln);if(h&&!/^[|]/.test(ln)){const [,f,v]=h;if(f==='L')L=frac(v,1/8);else if(f==='M')M=v.trim();else if(f==='K'){key=keySig(v);if(body.length)body.push('');}else if(f==='Q'){const m=/(\d+)\s*\/\s*(\d+)\s*=\s*(\d+)/.exec(v);if(m)qbpm=(+m[3])*((+m[1])/(+m[2]))/0.25;else if(/^\s*\d+/.test(v))qbpm=parseInt(v)}continue}
  if(/^\s*%/.test(ln))continue;body.push(ln.replace(/%.*$/,''))}
 if(L===null){const mf=frac(M,1);L=(M!=='none'&&mf<0.75)?1/16:1/8}
 const unit=L*4,notes=[];let t=0,bar={},tie=null,tup=0,tupF=1,broken=0,last=null;
 const s=body.join(' ');let i=0;
 const re=/^(\^\^|\^|__|_|=)?([A-Ga-g])([,']*)(\d*)(\/*)(\d*)/,rr=/^[zx](\d*)(\/*)(\d*)/;
 const dur=(a,sl,b)=>{let n=a?+a:1,d=1;if(sl){d=b?+b:Math.pow(2,sl.length);}return n/d};
 while(i<s.length){const c=s[i],rest=s.slice(i);
  if(c==='"'){const j=s.indexOf('"',i+1);i=j<0?s.length:j+1;continue}
  if(c==='!'){const j=s.indexOf('!',i+1);i=j<0?s.length:j+1;continue}
  if(c==='{'){const j=s.indexOf('}',i+1);i=j<0?s.length:j+1;continue}
  if(c==='['&&/^\[[A-Za-z]:/.test(rest)){const j=s.indexOf(']',i);const fld=s.slice(i+1,j<0?s.length:j);if(fld[0]==='K')key=keySig(fld.slice(2));if(fld[0]==='L')L=frac(fld.slice(2),L);i=j<0?s.length:j+1;continue}
  if(c==='|'||c===':'||c===']'||c==='['){bar={};i++;continue}
  if(c==='('&&/^\(\d/.test(rest)){const n=+s[i+1];tup=n;tupF=n===3?2/3:n===2?3/2:(n-1)/n;i+=2;continue}
  if(c==='>'||c==='<'){if(last){const f=c==='>'?1.5:0.5;t-=last.d;last.d*=f;t+=last.d;broken=c==='>'?0.5:1.5}i++;continue}
  if(c==='-'){if(last)tie=last;i++;continue}
  let m=rr.exec(rest);
  if(m){let d=dur(m[1],m[2],m[3])*unit;if(tup){d*=tupF;tup--}if(broken){d*=broken;broken=0}t+=d;last=null;tie=null;i+=m[0].length;continue}
  m=re.exec(rest);
  if(m){const [all_,ac,l,oc,a,sl,b]=m;const up=l.toUpperCase();let midi={C:60,D:62,E:64,F:65,G:67,A:69,B:71}[up]+(l===up?0:12);for(const o of oc)midi+=o===','?-12:12;const bk=up+midi;
   let alt;if(ac){alt={'^^':2,'^':1,'__':-2,'_':-1,'=':0}[ac];bar[bk]=alt}else alt=bar[bk]??key[up]??0;midi+=alt;
   let d=dur(a,sl,b)*unit;if(tup){d*=tupF;tup--}if(broken){d*=broken;broken=0}
   if(tie&&tie.m===midi){tie.d+=d;last=tie}else{last={t,d,m:midi};notes.push(last)}tie=null;t+=d;i+=all_.length;continue}
  i++}
 return {notes,len:t,qbpm}
}

/* ---- Audio ---- */
let ctx=null,raf=0,loopT=0,startAt=0,total=0;
function noiseBuf(c){const b=c.createBuffer(1,c.sampleRate*0.25,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
function palma(c,dest,at,strong,buf){const s=c.createBufferSource();s.buffer=buf;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=strong?1300:1800;f.Q.value=1.1;const g=c.createGain();const v=strong?0.9:0.32;g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(v,at+0.002);g.gain.exponentialRampToValueAtTime(0.001,at+(strong?0.14:0.08));s.connect(f).connect(g).connect(dest);s.start(at);s.stop(at+0.2);
 if(strong){const o=c.createOscillator(),og=c.createGain();o.frequency.setValueAtTime(150,at);o.frequency.exponentialRampToValueAtTime(60,at+0.12);og.gain.setValueAtTime(0.5,at);og.gain.exponentialRampToValueAtTime(0.001,at+0.15);o.connect(og).connect(dest);o.start(at);o.stop(at+0.16)}}
function tone(c,dest,at,dur,midi,inst){const f=440*Math.pow(2,(midi-69)/12);const g=c.createGain(),lp=c.createBiquadFilter();lp.type='lowpass';
 const o=c.createOscillator();const cfg={voz:['sawtooth',1700,0.05,0.16],flauta:['triangle',3000,0.06,0.22],trompeta:['sawtooth',2600,0.03,0.2]}[inst]||['triangle',3000,0.05,0.2];
 o.type=cfg[0];lp.frequency.value=cfg[1];o.frequency.setValueAtTime(f,at);
 const lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=5.4;lg.gain.setValueAtTime(0,at);lg.gain.linearRampToValueAtTime(f*(inst==='trompeta'?0.004:0.009),at+Math.min(0.35,dur*0.6));lfo.connect(lg).connect(o.frequency);
 const end=at+Math.max(dur,0.06),v=cfg[3];g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(v,at+cfg[2]);g.gain.setValueAtTime(v,Math.max(at+cfg[2],end-0.06));g.gain.linearRampToValueAtTime(0,end);
 o.connect(lp).connect(g).connect(dest);o.start(at);lfo.start(at);o.stop(end+0.02);lfo.stop(end+0.02)}
let queue=[];
function stop(full=true){cancelAnimationFrame(raf);clearTimeout(loopT);if(ctx){ctx.close().catch(()=>{});ctx=null}if(full)queue=[];const b=$('#b-play');if(b)b.textContent='▶ Escuchar';const b2=$('#b-play2');if(b2)b2.textContent='▶ Escuchar este';const ph=$('#phi');if(ph)ph.style.width='0'}
function play(key=sel,btn='#b-play'){
 const x=find(key);if(!x)return;const p=savePrefs();const cp=COMPAS[compasOf(x)]||COMPAS.libre;const tune=parseABC(E(x.key).abc||'');
 const useMel=p.mel&&tune.notes.length>0,useComp=p.comp&&cp.n>0;
 if(!useMel&&!useComp){toast(tune.notes.length?'Activa la melodía o el compás.':'No hay melodía todavía: activa el compás para practicar el ritmo.');return}
 const bpm=tune.qbpm*p.vel/100,spq=60/bpm,u=cp.u||1;
 const lead=(p.ent&&useComp)?cp.n:0;const melLen=useMel?tune.len/u:cp.n*4;const pulses=lead+Math.ceil(melLen-1e-6);
 try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){toast('Este navegador no permite reproducir audio aquí.');return}
 const master=ctx.createGain();master.gain.value=0.8;master.connect(ctx.destination);const buf=noiseBuf(ctx);
 startAt=ctx.currentTime+0.12;total=pulses*u*spq;
 if(useComp){const ini=Math.max(1,+(E(x.key).inicio||1));for(let k=0;k<pulses;k++){const pos=((((k-lead)+(ini-1))%cp.n)+cp.n)%cp.n+1;palma(ctx,master,startAt+k*u*spq,cp.acc.includes(pos),buf)}}
 if(useMel)for(const n of tune.notes)tone(ctx,master,startAt+(lead*u+n.t)*spq,n.d*spq*0.97,n.m+p.semi,p.inst);
 const bt=$(btn);if(bt)bt.textContent='■ Parar';
 const tick=()=>{if(!ctx)return;const el=ctx.currentTime-startAt,ph=$('#phi');if(ph)ph.style.width=Math.min(100,Math.max(0,el/total*100))+'%';if(el<total)raf=requestAnimationFrame(tick)};tick();
 loopT=setTimeout(()=>{const lp=$('#o-loop')?.checked;stop(false);if(queue.length){const [k2,b2]=queue.shift();play(k2,b2)}else if(lp&&(sel===x.key||cmpKey===x.key))play(key,btn)},(total+0.25)*1000);
}

/* ---- Guardar, exportar, importar ---- */
function save(){
 S.savedAt=new Date().toISOString();const json=JSON.stringify(S,null,1);
 try{const url=URL.createObjectURL(new Blob([json],{type:'application/json'}));const el=document.createElement('a');el.href=url;el.download=DATA;document.body.appendChild(el);el.click();setTimeout(()=>{URL.revokeObjectURL(url);el.remove()},800)}catch(e){toast('No se pudo descargar el archivo.');return}
 dirty=false;persist(S.savedAt);paintSave();toast('Descargado cante-datos.json: súbelo a lab (sustituyendo el anterior) y la página pública se actualiza.')
}
function openModal(html){$('#mbox').innerHTML=html;$('#modal').dataset.open='1';const f=$('#mbox').querySelector('input,textarea,button');if(f)f.focus()}
function closeModal(){$('#modal').dataset.open='0'}
function importar(){openModal(`<h3 id="m-t">Importar datos</h3><p class="desc">Elige un archivo .json exportado antes o pega su contenido. Sustituirá los datos actuales de esta página.</p><input type="file" accept=".json,application/json" id="m-file"><textarea id="m-json" placeholder="Pega aquí el JSON"></textarea><div class="row"><button class="btn" type="button" data-close>Cancelar</button><button class="btn pri" type="button" id="m-load">Importar</button></div>`)}
function addTo(fk){openModal(`<h3 id="m-t">Añadir estilo o variante</h3><label class="f">Nombre<input id="m-name" placeholder="p. ej. Joaquín el de la Paula 5"></label><div class="row"><button class="btn" type="button" data-close>Cancelar</button><button class="btn pri" type="button" id="m-add" data-fk="${fk}">Añadir</button></div>`)}

/* ---- Eventos ---- */
let drawT=0;
document.addEventListener('click',async ev=>{
 const t=ev.target.closest('button');if(!t)return;
 if(t.id==='b-bas'){soloB=!soloB;t.setAttribute('aria-pressed',soloB);renderTree();return}
 if(t.dataset.fi){filtro=t.dataset.fi;document.querySelectorAll('[data-fi]').forEach(b=>b.setAttribute('aria-pressed',b===t));renderTree();return}
 if(t.dataset.fam){closed.has(t.dataset.fam)?closed.delete(t.dataset.fam):closed.add(t.dataset.fam);renderTree();return}
 if(t.dataset.k){stop();cmpKey='';sel=t.dataset.k;const x=find(sel);if(x&&x.p.id!==palo){palo=x.p.id}renderAll();if(innerWidth<820)$('#main').scrollIntoView({behavior:'smooth'});return}
 if(t.dataset.addto){addTo(t.dataset.addto);return}
 if(t.hasAttribute('data-close')){closeModal();return}
 if(t.id==='b-play'){ctx?stop():play();return}
 if(t.id==='b-play2'){ctx?stop():play(cmpKey,'#b-play2');return}
 if(t.id==='b-ab'){stop();queue=[[cmpKey,'#b-play2']];play(sel,'#b-play');return}
 if(t.id==='b-tpl'){const x=find(sel);const ta=document.querySelector('[data-f=abc]');const cur=ta.value.trim();if(cur&&!cur.startsWith('X:')){ta.value=TPL[compasOf(x)]+cur}else if(!cur){ta.value=TPL[compasOf(x)].replace('T:\n','T:'+x.it.n+'\n')}else{toast('Ya hay una cabecera ABC.');return}setE(sel,'abc',ta.value);drawSheet();refreshStatus();ta.focus();return}
 if(t.id==='b-save'){save();return}
 if(t.id==='b-mx'){$('#f-mx').click();return}
 if(t.id==='m-mxok'){closeModal();if(pendingMx)pendingMx();pendingMx=null;return}
 if(t.id==='b-imp'){importar();return}
 if(t.id==='m-copy'){try{await navigator.clipboard.writeText($('#m-json').value);toast('Copiado.')}catch(e){$('#m-json').select();toast('Selecciona el texto y cópialo a mano.')}return}
 if(t.id==='m-load'){try{const d=JSON.parse($('#m-json').value);if(!d||typeof d.items!=='object')throw 0;S={v:1,savedAt:d.savedAt||null,items:d.items,extra:d.extra||{}};closeModal();sel=null;markDirty();renderAll();toast('Importado y guardado en este navegador.')}catch(e){toast('Ese texto no es un archivo de datos válido.')}return}
 if(t.id==='m-add'){const n=$('#m-name').value.trim();if(!n){toast('Escribe un nombre.');return}const fk=t.dataset.fk;(S.extra[fk]=S.extra[fk]||[]).push({id:'x-'+Date.now().toString(36),n});closeModal();markDirty();renderAll();return}
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.addEventListener('change',async e=>{
 const t=e.target;
 if(t.id==='m-file'&&t.files[0]){$('#m-json').value=await t.files[0].text();return}
 if(t.id==='f-mx'&&t.files[0]){const f=t.files[0];t.value='';importMx(f);return}
 if(t.id==='psel'){palo=t.value;sel=null;stop();renderAll();return}
 if(t.id==='o-bas'){setE(sel,'b',t.checked);refreshStatus();return}
 if(t.id==='o-cmp'){stop();cmpKey=t.value;drawCmp();return}
 if(t.dataset.f){setE(sel,t.dataset.f,t.dataset.f==='inicio'?Math.min(12,Math.max(1,+t.value||1)):t.value);if(t.dataset.f==='compas'){stop();renderEditor()}refreshStatus();return}
 if(t.id&&t.id.startsWith('o-')){savePrefs();if(t.id==='o-semi'||t.id==='o-lect'){drawSheet();drawCmp()}}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='q'){q=t.value;renderTree();return}
 if(t.id==='o-vel'){$('#o-velv').textContent=t.value+'%';return}
 if(t.dataset.f&&t.tagName!=='SELECT'){S.items[sel]={...E(sel),[t.dataset.f]:t.value};markDirty();if(t.dataset.f==='abc'){clearTimeout(drawT);drawT=setTimeout(()=>{drawSheet();refreshStatus()},350)}}
});
let pendingMx=null;
async function importMx(f){
 try{const xml=await readScoreFile(f);const doc=new DOMParser().parseFromString(xml,'application/xml');if(doc.getElementsByTagName('parsererror').length||!doc.documentElement||!/score-(partwise|timewise)/.test(doc.documentElement.tagName))throw new Error('Ese archivo no es un MusicXML de partitura. Exporta desde MuseScore con Archivo → Exportar → MusicXML.');
  if(doc.documentElement.tagName==='score-timewise')throw new Error('Exporta la partitura en formato «partwise» (el normal de MuseScore).');
  const r=mx2abc(doc);const key=sel;
  const apply=()=>{const e=E(key);S.items[key]={...e,abc:r.abc,...(r.letra&&!e.letra?{letra:r.letra}:{}),...(!e.estado||e.estado==='pendiente'?{estado:'borrador'}:{})};markDirty();renderAll();toast('Partitura importada. Revísala y, si está bien, márcala como Lista.')};
  if((E(key).abc||'').trim()){pendingMx=apply;openModal(`<h3 id="m-t">¿Sustituir la melodía?</h3><p class="desc">Este estilo ya tiene una melodía escrita. Si importas «${esc(f.name)}», la actual se reemplaza.</p><div class="row"><button class="btn" type="button" data-close>Cancelar</button><button class="btn pri" type="button" id="m-mxok">Sustituir</button></div>`)}else apply()
 }catch(err){toast(err&&err.message?err.message:'No se pudo leer el archivo.')}
}
function refreshStatus(){const tag=$('#sttag');if(tag)tag.textContent=ST_LAB[st(sel)];const sl=document.querySelector('[data-f=estado]');if(sl)sl.value=st(sel);renderTop();renderTabs();renderTree()}

async function load(){
 try{const r=await fetch(DATA,{cache:'no-store'});if(r.ok){const d=await r.json();if(d&&d.items)S={v:1,savedAt:d.savedAt||null,items:d.items,extra:d.extra||{}}}}catch(e){}
 try{const d=JSON.parse(localStorage.getItem(DKEY)||'null');if(d&&d.state&&(!S.savedAt||d.at>S.savedAt)){S=d.state;dirty=!!d.dirty||!S.savedAt||d.at>S.savedAt}}catch(e){}
 for(const [o,n] of Object.entries(MIGRA))if(S.items[o]&&!S.items[n]){S.items[n]=S.items[o];delete S.items[o]}
 paintSave();renderAll();
}
load();
}
</script>
