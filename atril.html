<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>El Atril</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600;700&family=Young+Serif&display=swap">
<style>
/* Layout: herramienta de atril — barra superior con pestañas, paneles de trabajo; letra con acordes encima en tipografía mono; latón como acento (trompeta) y verde azulado para los acordes */
:root{
  --bg:#F1F2EE; --surface:#FBFBF8; --sunk:#E7E9E3; --ink:#1B211E; --muted:#5C6660; --line:#D3D8D0;
  --chord:#17666E; --brass:#94650C; --brass-ink:#FFFFFF; --hl:#EADFC2; --ok:#2E7443; --warn:#9A6A00; --danger:#A33A2A;
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101412; --surface:#171C19; --sunk:#0C0F0D; --ink:#E6E8E1; --muted:#98A29B; --line:#2A312D;
  --chord:#78C6CC; --brass:#D9A43D; --brass-ink:#1A1405; --hl:#2F2815; --ok:#6CC08B; --warn:#E0B350; --danger:#E3806E; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#101412; --surface:#171C19; --sunk:#0C0F0D; --ink:#E6E8E1; --muted:#98A29B; --line:#2A312D;
  --chord:#78C6CC; --brass:#D9A43D; --brass-ink:#1A1405; --hl:#2F2815; --ok:#6CC08B; --warn:#E0B350; --danger:#E3806E; color-scheme:dark }
.stage.night{
  --bg:#0A0C0B; --surface:#121513; --sunk:#070908; --ink:#F1F1EA; --muted:#9AA29C; --line:#262C28;
  --chord:#86D3D8; --brass:#E3AE45; --brass-ink:#1A1405; --hl:#33290F; color-scheme:dark }

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.15}
a{color:var(--chord)}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 20px}
.brand{display:flex;align-items:baseline;gap:10px;padding-bottom:10px;margin-right:auto}
.brand h1{font-size:1.55rem;letter-spacing:.01em}
.brand small{color:var(--muted);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs button{border:0;background:none;padding:9px 14px 11px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass)}
.tools{display:flex;gap:8px;align-items:center;padding-bottom:10px}
.mode{font-size:.75rem;color:var(--muted);font-family:var(--f-mono)}
.mode b{color:var(--ok);font-weight:600}
.mode b.local{color:var(--warn)}

main{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:700;font-size:.92rem;line-height:1.2;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.btn.ghost{background:none;border-color:transparent}
.btn.sm{padding:5px 9px;font-size:.84rem}
.btn.danger{color:var(--danger)}
.btn.on{background:var(--hl);border-color:var(--brass)}
.btn[disabled]{opacity:.45;cursor:default}
.seg-ctl{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.seg-ctl button{border:0;background:none;padding:6px 10px;font-weight:700}
.seg-ctl button:hover{background:var(--sunk)}
.seg-ctl span{font-family:var(--f-mono);font-size:.85rem;min-width:3.4ch;text-align:center;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 11px;font-size:.84rem;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:.76rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px;white-space:nowrap}
.tag b{color:var(--ink);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--line)}
.dot.lista{background:var(--ok)} .dot.aprendiendo{background:var(--brass)} .dot.pendiente{background:var(--line);box-shadow:inset 0 0 0 1.5px var(--muted)}
.label{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 22px;color:var(--muted);text-align:left;max-width:60ch}
.empty h3{color:var(--ink);font-size:1.25rem;margin-bottom:6px}

input[type=text],input[type=number],input[type=url],input[type=search],input[type=email],input[type=password],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
textarea{resize:vertical;min-height:80px}
input[type=range]{width:100%;accent-color:var(--brass)}
input[type=checkbox]{accent-color:var(--brass);width:17px;height:17px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:700;color:var(--muted);min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}

/* CANCIONES */
.songs{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
.list-pane{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 100px);min-width:0}
.list{list-style:none;margin:0;padding:0;overflow:auto;border-top:1px solid var(--line);min-height:0}
.list li button{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 6px}
.list li button:hover{background:var(--sunk)}
.list li button[aria-current="true"]{background:var(--hl)}
.list .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .a{font-size:.83rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .k{font-family:var(--f-mono);font-size:.8rem;color:var(--chord);font-weight:600}
.sheet{min-width:0}
.sheet-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:clamp(1.6rem,3.2vw,2.3rem)}
.sheet-head .who{color:var(--muted);margin-top:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:12px}
.back{display:none}

/* hoja de acordes */
.chart{--fs:1;font-size:calc(1.06rem * var(--fs));line-height:1.35;padding-block:10px 30px;overflow-wrap:anywhere}
.ln{display:flex;flex-wrap:wrap;align-items:flex-end;min-height:1.35em;margin-bottom:.15em}
.ln.has{margin-top:.25em}
.sg{display:inline-flex;flex-direction:column;white-space:pre}
.sg .c{font-family:var(--f-mono);font-weight:700;color:var(--chord);font-size:.88em;line-height:1.25;padding-right:.6ch;min-height:1.25em}
.sg .l{white-space:pre}
.ln.only .sg .c{padding-right:1.6ch}
.sec{font-family:var(--f-mono);font-size:.74em;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);font-weight:700;margin-top:1.1em;margin-bottom:.2em}
.gap{height:.8em}
.sg .c.sounding{background:var(--brass);color:var(--brass-ink);border-radius:5px}
.player{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:6px}
.player select{width:auto;max-width:100%;padding:5px 8px}
.lyric{max-width:62ch}
.lyric .ll{white-space:pre-wrap;min-height:1.35em}
button.tag{background:none;cursor:pointer}
button.tag:hover{background:var(--sunk)}
.list.lyr li button{grid-template-columns:minmax(0,1fr) auto}
.mel-staff{padding-block:6px 14px;min-height:40px}
.mel-row{display:block;margin-bottom:4px;max-width:100%;overflow:visible}
.mel-row .ms{stroke:var(--muted);stroke-width:1;opacity:.6}
.mel-row .mi{fill:var(--ink)}
.mel-row .mis{stroke:var(--ink);fill:none}
.mel-row .mh{fill:var(--ink)}
.mel-row .mh.hol{fill:none;stroke:var(--ink);stroke-width:1.6}
.mel-row .out .mh{fill:var(--danger)}
.mel-row .out .mh.hol{fill:none;stroke:var(--danger)}
.mel-row .mt{font-family:var(--f-mono);font-size:10.5px;fill:var(--muted);text-anchor:middle}
.mel-row .mtn{font-family:var(--f-mono);font-size:11px;font-weight:700;fill:var(--chord);text-anchor:middle}
.mel-row .mfg{fill:var(--chord);stroke:var(--chord);stroke-width:1.2}
.mel-row .mfo{fill:none;stroke:var(--chord);stroke-width:1.2}
.mel-row .mtab{stroke:var(--muted);stroke-width:1;opacity:.55}
.mel-row .mtb{fill:var(--bg)}
.mel-row .mbg{fill:transparent}
.mel-row .mcol{cursor:pointer}
.mel-row .mcol.sel .mbg,.mel-row .mcol.playing .mbg,.mel-row .mcol.sel .mtb,.mel-row .mcol.playing .mtb{fill:var(--hl)}
.mel-row .mcol.playing .mh{fill:var(--brass)}
.mel-row .mcol.playing .mh.hol{fill:none;stroke:var(--brass)}
.mel-row .mcur{stroke:var(--brass);stroke-width:2}
.mel-row .mcurh{fill:var(--brass)}
.im-item{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.me-rec{flex:none;background:var(--surface);border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:9px;max-height:72vh;overflow:auto}
.me-rec>*{width:100%;max-width:760px;margin-inline:auto}
.me-rec[hidden],.mel-ed.recording .me-panel{display:none}
.rec-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rec-btn{font-size:1.02rem;padding:9px 18px}
.rec-dot{color:#D23B2E}
.btn.pri .rec-dot{color:#FFE3DD}
.rec-live{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center}
.rec-note{font-family:var(--f-mono);font-weight:700;font-size:2.5rem;line-height:1.05;color:var(--chord)}
.rec-cents{position:relative;height:8px;background:var(--sunk);border-radius:4px;grid-column:1/-1}
.rec-cents::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--muted)}
.rec-cents i{position:absolute;top:0;bottom:0;width:10px;margin-left:-5px;border-radius:4px;background:var(--brass);left:50%;transition:left .08s}
.rec-meter{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;grid-column:1/-1}
.rec-meter i{display:block;height:100%;width:0;background:var(--ok)}
.rec-beats{display:flex;gap:6px}
.rec-beats b{width:13px;height:13px;border-radius:50%;background:var(--sunk);border:1px solid var(--line)}
.rec-beats b.on{background:var(--brass);border-color:var(--brass)}
.mel-ed{position:fixed;inset:0;z-index:240;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
.mel-ed[hidden]{display:none}
.me-title{flex:1;min-width:0;font-family:var(--f-display);font-size:1.15rem;border-color:transparent;background:none}
.me-body{flex:1;min-height:0;overflow:auto;padding:12px max(14px,env(safe-area-inset-left,0px)) 16px;display:flex;flex-direction:column;gap:10px}
.me-body>*{width:100%;max-width:980px;margin-inline:auto;flex:none}
.me-meta{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:8px}
.me-more summary{cursor:pointer;padding:6px 0}
.me-more>*+*{margin-top:8px}
.me-panel{flex:none;background:var(--surface);border-top:1px solid var(--line);padding:8px max(10px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:7px}
.me-panel>*{width:100%;max-width:760px;margin-inline:auto}
.me-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.piano{position:relative;display:flex;height:112px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.piano button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.piano .wk{flex:1;margin:0 1px;background:#FBF8F0;color:#1D1C19;border:1px solid #CFC8B8;border-radius:0 0 8px 8px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;padding:0 0 7px;font-weight:700;font-size:.82rem}
.piano .bk{position:absolute;top:0;width:7.8%;height:60%;background:#1D1C19;color:#F4F0E6;border:0;border-radius:0 0 6px 6px;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:1px;padding:0 0 5px;font-size:.6rem;font-weight:700}
.piano small{font-family:var(--f-mono);font-size:.66rem;font-weight:600;color:#17666E}
.piano .bk small{color:#EADFC2}
.piano .k-out{opacity:.4}
.piano .wk:active{background:#EADFC2}
.piano .bk:active{background:#94650C}
@media (max-width:520px){.me-meta{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.me-meta label:first-child{grid-column:1/-1}.piano{height:104px}}
.extras{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;padding-top:16px;border-top:1px solid var(--line)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.box h3{font-family:var(--f-body);font-weight:700;font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.links{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.links a{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;overflow-wrap:anywhere}
.links a small{color:var(--muted);font-weight:400;font-family:var(--f-mono);font-size:.75rem}
audio{width:100%;height:40px}
.note{white-space:pre-wrap}

/* SETS */
.sets{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;align-items:start}
.setlist{list-style:none;margin:0;padding:0;counter-reset:n}
.setlist li{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}
.setlist li::before{counter-increment:n;content:counter(n,decimal-leading-zero);font-family:var(--f-mono);color:var(--muted);font-size:.85rem}
.setlist .t{font-weight:700}
.setlist .a{color:var(--muted);font-size:.85rem}
.big-start{font-size:1.05rem;padding:12px 20px}

/* ESCENARIO */
.stage{position:fixed;inset:0;z-index:100;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
.stage-top{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:8px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.stage-title{margin-right:auto;min-width:0}
.stage-title h2{font-size:clamp(1.25rem,3vw,1.8rem);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage-title .who{color:var(--muted);font-size:.9rem}
.pos{font-family:var(--f-mono);font-size:.85rem;color:var(--brass);font-weight:700}
.stage-body{flex:1;overflow:auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:12px 40vh}
.stage-body .chart{--fs:1.3;max-width:1100px}
.stage-meta{display:flex;flex-wrap:wrap;gap:6px;padding-top:6px}
.stage-nav{display:grid;grid-template-columns:1fr minmax(0,1.3fr) 1fr;gap:10px;align-items:center;padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);background:var(--surface)}
.navbtn{display:flex;flex-direction:column;align-items:flex-start;gap:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;text-align:left;min-width:0}
.navbtn.next{align-items:flex-end;text-align:right}
.navbtn .label{font-size:.66rem}
.navbtn .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.navbtn[disabled]{opacity:.35}
.stage-mid{display:flex;align-items:center;gap:8px;justify-content:center;min-width:0}
.count-flash{width:12px;height:12px;border-radius:50%;background:var(--line);flex:none;transition:background .05s}
.count-flash.on{background:var(--brass)}

/* ENSAYO */
.practice{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-h h2{font-size:1.35rem}
.now{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:end;background:var(--sunk);border-radius:12px;padding:14px 18px}
.now .cur{font-family:var(--f-mono);font-weight:700;font-size:clamp(2.6rem,7vw,4.2rem);color:var(--chord);line-height:1}
.now .nxt{font-family:var(--f-mono);color:var(--muted);text-align:right;font-size:1rem}
.now .nxt b{display:block;font-size:1.6rem;color:var(--ink)}
.beats{display:flex;gap:6px;grid-column:1/-1}
.beats i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.beats i.on{background:var(--brass)}
.bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.bar{border:1px solid var(--line);border-radius:6px;padding:8px 6px;font-family:var(--f-mono);font-weight:600;font-size:.95rem;display:flex;justify-content:space-around;gap:4px;min-height:2.6em;align-items:center;color:var(--ink);overflow:hidden}
.bar.on{background:var(--hl);border-color:var(--brass)}
.hint{font-size:.88rem;color:var(--muted);background:var(--bg);border-radius:8px;padding:8px 10px}
.hint b{color:var(--ink)}
.mix{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px 14px}
.mix label{font-size:.8rem;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.bpm-big{display:flex;align-items:baseline;gap:8px}
.bpm-big output{font-family:var(--f-mono);font-weight:700;font-size:3rem;line-height:1;color:var(--ink)}

.mdots i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line)}
.mdots i.acc{border-color:var(--muted)}
.mdots i.on{background:var(--brass);border-color:var(--brass)}
.play{min-width:110px}

/* RECURSOS */
.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;margin-top:14px}
.res{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.res h3{font-size:1.2rem}

.res ul.nl{margin:0;padding-left:1.1em}
.res-foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}

.ce{position:fixed;inset:0;z-index:250;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
.ce-top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:8px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.ce-top h2{font-size:1.25rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60vw}
.ce-help{padding:8px max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));font-size:.85rem;color:var(--muted)}
.ce-body{flex:1;overflow:auto;padding-top:6px;padding-bottom:24px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));font-family:var(--f-mono);font-size:var(--cefs,15px)}
.ce-line{padding-top:4px;margin-bottom:6px}
.ce-in{position:relative;overflow-x:auto}
.ce-probe{position:absolute;visibility:hidden;white-space:pre;font-family:var(--f-mono);font-size:var(--cefs)}
.ce-chords{position:relative;height:1.9em}
.ce-chip{position:absolute;top:2px;left:calc(var(--p)*1ch);border:0;background:none;padding:0;margin:0;font:inherit;font-weight:700;color:var(--chord);line-height:1.5;touch-action:none;cursor:grab;border-radius:3px;white-space:pre}
.ce-chip::after{content:"";position:absolute;inset:-6px -4px}
.ce-chip.sel{background:var(--hl);box-shadow:0 0 0 2px var(--brass);color:var(--ink);z-index:2}
.ce-text{white-space:nowrap;height:1.7em}
.ce-text i{display:inline-block;width:1ch;height:1.7em;line-height:1.7em;text-align:center;font-style:normal;cursor:pointer;border-radius:2px}
.ce-text i:hover{background:var(--hl)}
.ce-text i.cur{background:var(--hl);box-shadow:inset 2px 0 0 var(--brass)}
.ce-sec{font-size:.75em;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);font-weight:700;margin-top:.9em}
.ce-gap{height:.8em}
.ce-raw{color:var(--muted);white-space:pre;overflow-x:auto}
.ce-bar{border-top:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:8px;padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));font-family:var(--f-body)}
.ce-cur{font-family:var(--f-mono);font-size:1.4rem;color:var(--chord)}

.studio{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
.span2{grid-column:1/-1}

.tp{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.tp .time{font-family:var(--f-mono);font-weight:600;font-size:.98rem;font-variant-numeric:tabular-nums}
.st-status{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:.9rem;color:var(--muted);min-height:1.4em}
.pbar{flex:1;min-width:120px;max-width:320px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--brass);width:0;transition:width .2s}
.seg-ctl.big button{padding:8px 16px;font-size:1.2rem}
.seg-ctl.big span{font-family:var(--f-mono);font-size:1.45rem;min-width:3ch;color:var(--ink);font-weight:700}
.mx{display:grid;grid-template-columns:minmax(0,1fr) auto auto minmax(80px,170px);gap:8px;align-items:center;padding-block:8px;border-bottom:1px solid var(--line)}

.mbtn{width:32px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--bg);font-family:var(--f-mono);font-weight:700;font-size:.8rem}
.mbtn.on[data-act="stMute"]{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.mbtn.on[data-act="stSolo"]{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.chip[disabled]{opacity:.4;cursor:default}
.howto{border-top:1px solid var(--line);padding-top:12px}
.howto summary{cursor:pointer;font-weight:700}
.howto ol{margin:.6em 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:72ch}
.warn{color:var(--warn);font-weight:700}
hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
@media (max-width:860px){.studio{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.mx{grid-template-columns:minmax(0,1fr) auto auto}.mx input[type=range]{grid-column:1/-1}}

/* MODAL */
.modal{position:fixed;inset:0;z-index:200;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:24px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}

.help{font-size:.82rem;color:var(--muted)}

@media (max-width:860px){
  .songs,.sets,.practice{grid-template-columns:minmax(0,1fr)}

}

<script>
"use strict";
function DSP_LIB(){
  "use strict";
  const TAU=Math.PI*2;
  const plans={};
  function plan(N){
    if(plans[N])return plans[N];
    const lev=Math.log2(N),rev=new Uint32Array(N);
    for(let i=0;i<N;i++){let r=0,x=i;for(let b=0;b<lev;b++){r=(r<<1)|(x&1);x>>=1}rev[i]=r}
    const cos=new Float64Array(N/2),sin=new Float64Array(N/2);
    for(let i=0;i<N/2;i++){cos[i]=Math.cos(TAU*i/N);sin[i]=Math.sin(TAU*i/N)}
    const w=new Float64Array(N);for(let i=0;i<N;i++)w[i]=.5-.5*Math.cos(TAU*i/N);
    return plans[N]={N,rev,cos,sin,w};
  }
  function fft(P,re,im,inv){
    const {N,rev,cos,sin}=P;
    for(let i=0;i<N;i++){const j=rev[i];if(j>i){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t}}
    for(let size=2;size<=N;size<<=1){
      const half=size>>1,step=N/size;
      for(let i=0;i<N;i+=size){
        for(let j=0,k=0;j<half;j++,k+=step){
          const wr=cos[k],wi=inv?sin[k]:-sin[k],a=i+j,b=a+half;
          const tr=re[b]*wr-im[b]*wi,ti=re[b]*wi+im[b]*wr;
          re[b]=re[a]-tr;im[b]=im[a]-ti;re[a]+=tr;im[a]+=ti;
        }
      }
    }
    if(inv){const s=1/N;for(let i=0;i<N;i++){re[i]*=s;im[i]*=s}}
  }
  /* empaqueta dos señales reales en una FFT compleja */
  function unpack(N,re,im,Lr,Li,Rr,Ri){
    const h=N/2;
    for(let k=0;k<=h;k++){
      const nk=(N-k)%N,xr=re[k],xi=im[k],yr=re[nk],yi=im[nk];
      Lr[k]=(xr+yr)*.5;Li[k]=(xi-yi)*.5;Rr[k]=(xi+yi)*.5;Ri[k]=-(xr-yr)*.5;
    }
    Li[0]=Ri[0]=Li[h]=Ri[h]=0;
  }
  function pack(N,re,im,Lr,Li,Rr,Ri){
    const h=N/2;
    re[0]=Lr[0];im[0]=Rr[0];re[h]=Lr[h];im[h]=Rr[h];
    for(let k=1;k<h;k++){
      re[k]=Lr[k]-Ri[k];im[k]=Li[k]+Rr[k];
      re[N-k]=Lr[k]+Ri[k];im[N-k]=Rr[k]-Li[k];
    }
  }
  const ss=(e0,e1,x)=>{let t=(x-e0)/(e1-e0);t=t<0?0:t>1?1:t;return t*t*(3-2*t)};

  /* Separación por máscaras espectrales. mode "voz": centro en banda vocal; "pan": izquierda/centro/derecha */
  function separate(L,R,sr,mode,opts,onProg){
    opts=opts||{};R=R||L;
    const N=2048,H=512,P=plan(N),w=P.w,h=N/2,len=L.length,norm=1/1.5;
    const re=new Float64Array(N),im=new Float64Array(N);
    const Lr=new Float64Array(h+1),Li=new Float64Array(h+1),Rr=new Float64Array(h+1),Ri=new Float64Array(h+1);
    const Ar=new Float64Array(h+1),Ai=new Float64Array(h+1),Br=new Float64Array(h+1),Bi=new Float64Array(h+1);
    const gamma=opts.gamma||5,lowCut=opts.lowCut||130,hiCut=opts.hiCut||15000;
    let outs,masks,prev;
    if(mode==="voz"){outs=[[new Float32Array(len)],[new Float32Array(len),new Float32Array(len)]];masks=[new Float64Array(h+1)];prev=[new Float64Array(h+1)]}
    else{outs=[0,1,2].map(()=>[new Float32Array(len),new Float32Array(len)]);masks=[0,1,2].map(()=>new Float64Array(h+1));prev=[0,1,2].map(()=>new Float64Array(h+1))}
    const tmp=new Float64Array(h+1);
    const frames=Math.ceil((len+N)/H);let fi=0;
    for(let pos=-N+H;pos<len;pos+=H,fi++){
      for(let n=0;n<N;n++){const i=pos+n;if(i>=0&&i<len){re[n]=L[i]*w[n];im[n]=R[i]*w[n]}else{re[n]=0;im[n]=0}}
      fft(P,re,im,false);unpack(N,re,im,Lr,Li,Rr,Ri);
      if(mode==="voz"){
        const m=masks[0],pv=prev[0];
        for(let k=0;k<=h;k++){
          const f=k*sr/N,a=Lr[k]*Lr[k]+Li[k]*Li[k],b=Rr[k]*Rr[k]+Ri[k]*Ri[k],cr=Lr[k]*Rr[k]+Li[k]*Ri[k];
          let c=2*cr/(a+b+1e-20);c=c<0?0:c>1?1:c;let v=Math.pow(c,gamma);
          if(f<lowCut)v=0;else if(f<lowCut*1.6)v*=(f-lowCut)/(.6*lowCut);
          if(f>hiCut)v*=Math.max(0,1-(f-hiCut)/4000);
          tmp[k]=v;
        }
        for(let k=0;k<=h;k++){const v=(tmp[k]*2+(k?tmp[k-1]:tmp[k])+(k<h?tmp[k+1]:tmp[k]))*.25;m[k]=v*.65+pv[k]*.35;pv[k]=m[k]}
        /* voz (mono) */
        for(let k=0;k<=h;k++){Ar[k]=m[k]*(Lr[k]+Rr[k])*.5;Ai[k]=m[k]*(Li[k]+Ri[k])*.5;Br[k]=0;Bi[k]=0}
        pack(N,re,im,Ar,Ai,Br,Bi);fft(P,re,im,true);
        { const o=outs[0][0];for(let n=0;n<N;n++){const i=pos+n;if(i>=0&&i<len)o[i]+=re[n]*w[n]*norm} }
        /* instrumental = original - voz */
        for(let k=0;k<=h;k++){const vr=Ar[k],vi=Ai[k];Ar[k]=Lr[k]-vr;Ai[k]=Li[k]-vi;Br[k]=Rr[k]-vr;Bi[k]=Ri[k]-vi}
        pack(N,re,im,Ar,Ai,Br,Bi);fft(P,re,im,true);
        { const oL=outs[1][0],oR=outs[1][1];for(let n=0;n<N;n++){const i=pos+n;if(i>=0&&i<len){oL[i]+=re[n]*w[n]*norm;oR[i]+=im[n]*w[n]*norm}} }
      }else{
        for(let k=0;k<=h;k++){
          const a=Math.sqrt(Lr[k]*Lr[k]+Li[k]*Li[k]),b=Math.sqrt(Rr[k]*Rr[k]+Ri[k]*Ri[k]);
          const q=(a+b)>1e-12?b/(a+b):.5;
          const wl=ss(.42,.2,q),wr=ss(.58,.8,q),wc=1-wl-wr;
          const ws=[wl,wc,wr];
          for(let s=0;s<3;s++){const v=ws[s]*.65+prev[s][k]*.35;prev[s][k]=v;masks[s][k]=v}
        }
        for(let k=0;k<=h;k++){const t=masks[0][k]+masks[1][k]+masks[2][k]||1;masks[0][k]/=t;masks[1][k]/=t;masks[2][k]/=t}
        for(let s=0;s<3;s++){
          const m=masks[s];
          for(let k=0;k<=h;k++){Ar[k]=Lr[k]*m[k];Ai[k]=Li[k]*m[k];Br[k]=Rr[k]*m[k];Bi[k]=Ri[k]*m[k]}
          pack(N,re,im,Ar,Ai,Br,Bi);fft(P,re,im,true);
          const oL=outs[s][0],oR=outs[s][1];
          for(let n=0;n<N;n++){const i=pos+n;if(i>=0&&i<len){oL[i]+=re[n]*w[n]*norm;oR[i]+=im[n]*w[n]*norm}}
        }
      }
      if(onProg&&(fi&255)===0)onProg(fi/frames);
    }
    return outs;
  }

  /* Vocoder de fase con bloqueo de fase (Laroche–Dolson). Estira el tiempo por alpha sin cambiar el tono.
     En estéreo usa la fase del canal medio para los dos canales y conserva la imagen. */
  function stretch(chs,alpha,onProg,pw,pofs){
    const N=2048,Hs=512,P=plan(N),w=P.w,h=N/2,norm=1/1.5;
    const L=chs[0],R=chs[1]||null,len=L.length,outLen=Math.max(1,Math.round(len*alpha)),Ha=Hs/alpha;
    const oL=new Float32Array(outLen),oR=R?new Float32Array(outLen):null;
    const re=new Float64Array(N),im=new Float64Array(N);
    const Lr=new Float64Array(h+1),Li=new Float64Array(h+1),Rr=new Float64Array(h+1),Ri=new Float64Array(h+1);
    let phIn=new Float64Array(h+1),prevIn=new Float64Array(h+1),phOut=new Float64Array(h+1),prevOut=new Float64Array(h+1);
    const mag=new Float64Array(h+1),peaks=new Int32Array(h+1),omega=new Float64Array(h+1);
    for(let k=0;k<=h;k++)omega[k]=TAU*k/N;
    const k0=-3,k1=Math.ceil(outLen/Hs)+3;let first=true,prevA=0;
    for(let k=k0;k<=k1;k++){
      const ca=Math.round(k*Ha),sa=ca-h,cs=k*Hs,so=cs-h;
      for(let n=0;n<N;n++){const i=sa+n;if(i>=0&&i<len){re[n]=L[i]*w[n];im[n]=R?R[i]*w[n]:0}else{re[n]=0;im[n]=0}}
      fft(P,re,im,false);unpack(N,re,im,Lr,Li,Rr,Ri);
      for(let b=0;b<=h;b++){const mr=Lr[b]+Rr[b],mi=Li[b]+Ri[b];mag[b]=mr*mr+mi*mi;phIn[b]=Math.atan2(mi,mr)}
      if(first){for(let b=0;b<=h;b++)phOut[b]=phIn[b];first=false}
      else{
        const dA=ca-prevA||1;
        let np=0;
        for(let b=2;b<h-1;b++){const m=mag[b];if(m>mag[b-1]&&m>=mag[b+1]&&m>mag[b-2]&&m>=mag[b+2]&&m>1e-14)peaks[np++]=b}
        if(np===0){
          for(let b=0;b<=h;b++){let d=phIn[b]-prevIn[b]-omega[b]*dA;d-=TAU*Math.round(d/TAU);phOut[b]=prevOut[b]+(omega[b]+d/dA)*Hs}
        }else{
          for(let i=0;i<np;i++){const p=peaks[i];let d=phIn[p]-prevIn[p]-omega[p]*dA;d-=TAU*Math.round(d/TAU);phOut[p]=prevOut[p]+(omega[p]+d/dA)*Hs}
          for(let i=0;i<np;i++){
            const p=peaks[i],st=i===0?0:((peaks[i-1]+p)>>1)+1,en=i===np-1?h:((p+peaks[i+1])>>1);
            const po=phOut[p],pi=phIn[p];
            for(let b=st;b<=en;b++)if(b!==p)phOut[b]=po+phIn[b]-pi;
          }
        }
        for(let b=0;b<=h;b++){const v=phOut[b];phOut[b]=v-TAU*Math.round(v/TAU)}
      }
      phOut[0]=phIn[0];phOut[h]=phIn[h];
      for(let b=0;b<=h;b++){
        const r=phOut[b]-phIn[b],c=Math.cos(r),s=Math.sin(r);
        let x=Lr[b],y=Li[b];Lr[b]=x*c-y*s;Li[b]=x*s+y*c;
        x=Rr[b];y=Ri[b];Rr[b]=x*c-y*s;Ri[b]=x*s+y*c;
      }
      Li[0]=Ri[0]=Li[h]=Ri[h]=0;
      pack(N,re,im,Lr,Li,Rr,Ri);fft(P,re,im,true);
      for(let n=0;n<N;n++){const i=so+n;if(i>=0&&i<outLen){oL[i]+=re[n]*w[n]*norm;if(oR)oR[i]+=im[n]*w[n]*norm}}
      let t=phIn;phIn=prevIn;prevIn=t;t=phOut;phOut=prevOut;prevOut=t;prevA=ca;
      if(onProg&&((k-k0)&127)===0)onProg((pofs||0)+(pw||1)*(k-k0)/(k1-k0));
    }
    return R?[oL,oR]:[oL];
  }
  function resample(x,factor){

    for(let i=0;i<n;i++){

    const sec=line.match(/^\s*#\s*(.+)$/)||line.match(/^\s*\{(?:c|comment|soc|start_of_chorus)[^:]*:?\s*(.*)\}\s*$/i);
    if(sec){out.push(`<div class="sec">${esc(sec[1]||"Estribillo")}</div>`);continue}
    const parts=line.split(/\[([^\]]*)\]/);
    if(parts.length===1){out.push(`<div class="ln">${esc(line)}</div>`);continue}
    const segs=[];
    if(parts[0])segs.push(["",parts[0]]);
    for(let i=1;i<parts.length;i+=2)segs.push([parts[i],parts[i+1]||"",parts[i]?k++:-1]);
    const onlyChords=segs.every(s=>!s[1].trim());
    let html="";
    for(const [c,t,kk] of segs){
      const toks=t?(t.match(/\S*\s*/g)||[]).filter(Boolean):[""];
      toks.forEach((tk,j)=>{

function loadScript(src){return new Promise((res,rej)=>{const t=document.createElement("script");t.src=src;t.onload=res;t.onerror=()=>rej(new Error("No se pudo cargar "+src));document.head.appendChild(t)})}
async function fbInit(){
  if(!fbOn())return false;if(FB.ready)return true;
  try{
    for(const m of ["app","auth","firestore"])await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-${m}-compat.js`);
    if(!firebase.apps.length)firebase.initializeApp(fbCfg());
    FB.auth=firebase.auth();FB.fdb=firebase.firestore();
    try{await FB.fdb.enablePersistence({synchronizeTabs:true})}catch(e){}   /* funciona sin cobertura con lo ya cargado */

  }catch(e){FB.err=e;return false}
}

const Store={
  mode:"cargando",db:null,assets:null,downloads:null,data:emptyData(),ready:false,sig:{},unsubs:[],
  async init(){
    let db=null;
    try{if(window.claude&&typeof window.claude.use==="function")db=await window.claude.use("db")}catch(e){db=null}
    if(db){
      this.attach(db,"nube");
      window.claude.use("assets").then(a=>this.assets=a).catch(()=>{});
      window.claude.use("downloads").then(d=>this.downloads=d).catch(()=>{});
      paintMode();return;
    }
    this.useLocal();paintMode();
    if(await fbInit()){
      FB.auth.onAuthStateChanged(u=>{
        FB.user=u;
        if(u){this.attach({collection:c=>FB.fdb.collection(FB_PATH(u.uid)+c)},"firebase")}
        else{this.useLocal();if(!FB.asked){FB.asked=true;let skip=false;try{skip=sessionStorage.getItem("atril:nologin")==="1"}catch(e){}if(!skip)loginModal()}}
        paintMode();
      });
    }else if(fbOn())toast("No se pudo cargar Firebase. Sigues con lo guardado en este navegador.");
  },
  detach(){this.unsubs.forEach(f=>{try{f()}catch(e){}});this.unsubs=[];this.db=null},
  useLocal(){this.detach();this.mode="local";this.data=Object.assign(emptyData(),localData());this.ready=true;lastSig={};onData()},
  attach(db,mode){
    this.detach();this.db=db;this.mode=mode;this.ready=false;this.sig={};lastSig={};this.data=emptyData();
    if(S.tab!=="studio")render();
    let got=0;const one=c=>{if(!this.sig[c]){this.sig[c]=1;got++}if(got>=COLS.length&&!this.ready){this.ready=true;onData(c)}};
    COLS.forEach(c=>{this.unsubs.push(db.collection(c).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});this.data[c]=o;if(this.ready)onData(c);one(c)},err=>{toast("No se pudo leer el cancionero: "+(err&&err.code||"error"));one(c)}))});
  },
  saveLocal(){LS.set("data",this.data)},
  async put(c,id,obj){obj.updatedAt=Date.now();if(this.db){try{await this.db.collection(c).doc(id).set(obj)}catch(e){toast("No se guardó: "+(e&&e.code||"error"));throw e}}else{this.data[c]={...this.data[c],[id]:obj};this.saveLocal();onData(c)}},

}

const IDB={
  db:null,urls:{},
  open(){return this.db?Promise.resolve(this.db):new Promise((res,rej)=>{try{const r=indexedDB.open("atril",1);r.onupgradeneeded=()=>r.result.createObjectStore("tracks");r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  async put(k,blob){const d=await this.open();return new Promise((res,rej)=>{const tx=d.transaction("tracks","readwrite");tx.objectStore("tracks").put(blob,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})},
  async get(k){const d=await this.open();return new Promise((res)=>{const tx=d.transaction("tracks","readonly");const r=tx.objectStore("tracks").get(k);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)})},
  async url(k){if(this.urls[k])return this.urls[k];try{const b=await this.get(k);if(!b)return null;return this.urls[k]=URL.createObjectURL(b)}catch(e){return null}}
};
function trackSrc(bk){if(!bk)return null;if(bk.kind==="asset"&&bk.assetId)return "/_blob/"+bk.assetId;return null}
function backingHTML(bk,compact){
  if(!bk||!bk.kind)return compact?'<span class="muted" style="font-size:.85rem">Sin pista</span>':'<p class="muted">Sin pista de acompañamiento.</p>';
  if(bk.kind==="url"){const u=SAFE_URL(bk.url);return u?`<a class="btn sm" href="${esc(u)}" target="_blank" rel="noopener">▶ Abrir pista${compact?"":" ↗"}</a>${compact?"":`<p class="help">${esc(bk.name||u)}</p>`}`:""}
  if(bk.kind==="asset")return `<audio controls preload="none" src="${esc(trackSrc(bk))}"></audio>${compact?"":`<p class="help">${esc(bk.name||"Pista")} · en la nube</p>`}`;
  if(bk.kind==="local")return `<audio controls preload="none" data-local="${esc(bk.localKey)}"></audio>${compact?"":`<p class="help">${esc(bk.name||"Pista")} · guardada en este dispositivo</p>`}`;
  return "";
}
async function hydrateAudio(root){for(const a of $$("audio[data-local]",root)){const u=await IDB.url(a.dataset.local);if(u)a.src=u;else{const p=document.createElement("p");p.className="help";p.textContent="Esta pista se guardó en otro dispositivo. Vuelve a subirla aquí para tenerla.";a.replaceWith(p)}}}

let lastSig={};
function onData(c){
  if(!Store.ready)return;

  if(S.tab==="studio"){stRefreshOptions();stPaintTransport();return}

  if(S.stage){renderStage();return}
  render();
}

/* ---------- render principal ---------- */
function render(){
  spSync();melSync();
  $$("#tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===S.tab)));
  if(S.tab!=="songs")stopScroll();
  const v=$("#view");
  if(!Store.ready){v.innerHTML='<p class="loading">Abriendo el cancionero…</p>';return}
  if(S.tab==="songs")v.innerHTML=viewSongs();
  else if(S.tab==="lyrics")v.innerHTML=viewLyrics();
  else if(S.tab==="melodies")v.innerHTML=viewMelodies();
  else if(S.tab==="sets")v.innerHTML=viewSets();

  else if(S.tab==="studio"){v.innerHTML=viewStudio();initStudio()}

/* desplazamiento automático */
function startScroll(el){S.scroll.on=true;S.scroll.el=el||null;S.scroll.last=performance.now();let acc=0;const step=now=>{if(!S.scroll.on)return;const dt=(now-S.scroll.last)/1000;S.scroll.last=now;acc+=dt*S.scroll.speed*9;const px=Math.floor(acc);if(px){acc-=px;const t=S.scroll.el;if(t)t.scrollTop+=px;else window.scrollBy(0,px)}S.scroll.raf=requestAnimationFrame(step)};S.scroll.raf=requestAnimationFrame(step)}
function stopScroll(){S.scroll.on=false;cancelAnimationFrame(S.scroll.raf)}

let wheelVis={beats:[]};
function wheelState(){const w=S.wheel;const pr=parseProg(w.prog,+w.key);const beatChords=[];pr.bars.forEach(bar=>{const per=w.meter/bar.length;bar.forEach((c,i)=>{const from=Math.round(i*per),to=Math.round((i+1)*per);for(let k=from;k<to;k++)beatChords.push(c)})});return {pr,beatChords}}
function drawWheel(){
  const w=S.wheel;const {pr}=wheelState();
  $("#wBars").innerHTML=pr.bars.map((b,i)=>`<div class="bar" data-bar="${i}">${b.map(c=>`<span>${pretty(c)}</span>`).join("")}</div>`).join("")||'<p class="muted">Escribe al menos un compás.</p>';
  $("#wBeats").innerHTML=Array.from({length:+w.meter},()=>"<i></i>").join("");
  $("#wKey").disabled=!pr.roman;$("#wKey").title=pr.roman?"":"La tonalidad solo se aplica a progresiones escritas en grados";
  const p=PRESETS.find(x=>x.id===w.preset);const so=String(w.preset).startsWith("song:")?Store.get("songs",w.preset.slice(5)):null;
  $("#wTip").innerHTML=p?p.tip:so?`<b>${esc(so.title)}</b>${keyOf(so)?" · tono <b>"+pretty(trKey(keyOf(so),trOf(so)))+"</b>":""}. Cada línea con acordes es un compás (si trae más de los que caben, se reparte en varios). Suena en el tono que ves en su hoja: si lo cambias allí, vuelve a elegirla aquí.`:"Progresión propia. Escríbela en grados (I, ii7, V7, bVII…) para poder cambiarla de tonalidad.";
  $("#wCur").textContent=pr.bars[0]?prettyTxt(pr.bars[0][0]):"—";$("#wNext").textContent=pr.bars[1]?prettyTxt(pr.bars[1][0]):"—";
}
const prettyTxt=s=>prettyAcc(String(s||""));
function metroCfg(){const m=S.metro;const [n,d]=m.meter.split("/").map(Number);let groups=[0];if(d===8){groups={5:[0,3],6:[0,3],7:[0,2,4],9:[0,3,6],12:[0,3,6,9]}[n]||[0]}return {bpm:+m.bpm,bpb:n,sub:+m.sub,accent:m.accent,groups}}
function drawDots(){const c=metroCfg();$("#mDots").innerHTML=Array.from({length:c.bpb},(_,i)=>`<i class="${c.groups.includes(i)?"acc":""}"></i>`).join("")}

function setMetroBpm(v){const m=S.metro;m.bpm=Math.max(30,Math.min(300,Math.round(v)));$("#mBpmOut").textContent=m.bpm;$("#mBpm").value=m.bpm;if(Eng.mode==="metro")Eng.cfg.bpm=m.bpm;persist()}
function setPlayButtons(){const w=$("#wPlay"),m=$("#mPlay");if(w){w.textContent=Eng.mode==="wheel"?"■ Parar":"▶ Tocar";w.classList.toggle("on",Eng.mode==="wheel")}if(m){m.textContent=Eng.mode==="metro"?"■ Parar":"▶ Empezar"}}
function startWheel(){
  const w=S.wheel;const {beatChords}=wheelState();if(!beatChords.length){toast("La progresión no tiene acordes reconocibles");return}
  const cfg={bpm:+w.bpm,style:w.style,meter:+w.meter,countIn:Eng.mode!=="wheel"&&w.countIn,beatChords,click:w.mix.click,
    spanAt(P){let k=0;const N=beatChords.length;const i0=(P.bar*P.bpb+P.beat)%N;const c=beatChords[i0];while(k<N&&beatChords[(i0+k)%N]===c)k++;return Math.max(1,k)}};
  Eng.start("wheel",cfg,e=>{
    const beats=$$("#wBeats i");
    if(e.count!=null){$("#wCur").textContent=String(e.count+1);beats.forEach((b,i)=>b.classList.toggle("on",i===e.count));return}

    beats.forEach((b,i)=>b.classList.toggle("on",i===e.beat));
  },()=>{$$("#wBars .bar").forEach(b=>b.classList.remove("on"));$$("#wBeats i").forEach(b=>b.classList.remove("on"));setPlayButtons()});
  Eng.setMix(w.mix);if(w.style==="click"&&w.mix.click<.3){cfg.click=.9;Eng.setMix({click:.9})}setPlayButtons();

function startMetro(){Eng.start("metro",metroCfg(),e=>{$$("#mDots i").forEach((d,i)=>d.classList.toggle("on",i===e.beat))},()=>{$$("#mDots i").forEach(d=>d.classList.remove("on"));setPlayButtons()});Eng.setMix({click:1});setPlayButtons()}

/* ---------- canciones → compases (para sonar en la hoja y para la rueda de ensayo) ---------- */
const hasChords=s=>/\[[^\]]+\]/.test(normBody(s.body));
const meterOf=s=>({2:2,3:3,4:4,6:2,12:4})[parseInt(s.timeSig,10)]||4;
function guessStyle(t){t=String(t||"").toLowerCase();if(/bossa/.test(t))return "bossa";if(/vals|waltz/.test(t))return "vals";if(/gypsy|manouche|django/.test(t))return "pompe";if(/swing|jazz/.test(t))return "swing";if(/rumba|flamenc|tango|bulería|buleria|sevillana|rumbita|tiento/.test(t))return "rumba";return "pop"}
/* cada línea con acordes es un compás; si trae más acordes que tiempos, se parte en varios compases */
function songBars(song,n,flats,meter){
  meter=meter||4;const bars=[];let k=0;
  for(const raw of normBody(song.body).split(/\r?\n/)){
    const line=raw.replace(/\s+$/,"");
    if(!line.trim()||/^\s*#\s*(.+)$/.test(line)||/^\s*\{(?:c|comment|soc|start_of_chorus)[^:]*:?\s*(.*)\}\s*$/i.test(line))continue;
    const parts=line.split(/\[([^\]]*)\]/);const cs=[];
    for(let i=1;i<parts.length;i+=2){const c=parts[i];if(!c)continue;const kk=k++;const t=c.trim();if(isChord(t))cs.push({sym:trChord(t,n,flats),k:kk})}
    for(let i=0;i<cs.length;i+=meter)bars.push(cs.slice(i,i+meter));
  }
  return bars;
}
function expandBars(bars,meter){
  const chords=[],ks=[];
  bars.forEach(bar=>{const per=meter/bar.length;bar.forEach((c,i)=>{const from=Math.round(i*per),to=Math.round((i+1)*per);for(let b=from;b<to;b++){chords.push(c.sym);ks.push(c.k)}})});
  return {chords,ks};
}
/* vuelca una canción en la rueda de ensayo */
function songToWheel(s){
  const n=trOf(s),meter=meterOf(s),bars=songBars(s,n,songFlats(s,n),meter);if(!bars.length)return false;
  Object.assign(S.wheel,{preset:"song:"+s.id,prog:bars.map(b=>b.map(c=>c.sym).join(" ")).join(" | "),bpm:+s.bpm||S.wheel.bpm||100,style:guessStyle(s.style),meter});
  return true;
}

/* ---------- tocar los acordes de una canción (sintético) ---------- */
const SP={id:null,on:false,meter:4,beatK:[],lastK:null};
function spOpts(s){const o=S.sp[s.id]||{};return {bpm:o.bpm||+s.bpm||100,style:o.style||guessStyle(s.style),loop:!!o.loop}}
function spStart(id){
  const s=Store.get("songs",id);if(!s)return;
  const n=trOf(s),meter=meterOf(s),bars=songBars(s,n,songFlats(s,n),meter);
  if(!bars.length){toast("Esta canción aún no tiene acordes que tocar");return}
  const {chords,ks}=expandBars(bars,meter);const o=spOpts(s);
  const cfg={bpm:o.bpm,style:o.style,meter,countIn:true,beatChords:chords,click:0,maxBeats:o.loop?0:chords.length,
    spanAt(P){const bc=Eng.cfg.beatChords,N=bc.length,i0=(P.bar*P.bpb+P.beat)%N,c=bc[i0];let k=0;while(k<N&&bc[(i0+k)%N]===c)k++;return Math.max(1,k)}};
  SP.id=id;SP.meter=meter;SP.beatK=ks;SP.lastK=null;
  Eng.start("wheel",cfg,spVis,()=>{SP.on=false;spHighlight(null);spPaint()});
  if(Eng.mode!=="wheel")return;
  SP.on=true;Eng.setMix(S.wheel.mix);spPaint();
}
function spVis(e){if(e.count!=null)return;spHighlight(SP.beatK[e.bar*SP.meter+e.beat])}
function spHighlight(k){
  const root=S.stage?$("#stage"):$("#view");if(!root)return;
  $$(".c.sounding",root).forEach(x=>x.classList.remove("sounding"));
  if(k==null||k<0){SP.lastK=null;return}
  const el=$(`.c[data-k="${k}"]`,root);if(!el)return;
  el.classList.add("sounding");
  if(SP.lastK!==k){SP.lastK=k;const r=el.getBoundingClientRect(),h=innerHeight;if(r.top<h*.18||r.bottom>h*.78)el.scrollIntoView({block:"center",behavior:"smooth"})}
}
function spPaint(){$$('[data-act="spPlay"]').forEach(b=>{const on=SP.on&&b.dataset.id===SP.id;b.classList.toggle("on",on);b.textContent=b.dataset.short?(on?"■":"▶"):(on?"■ Parar":"▶ Tocar acordes")})}
/* si cambias de canción o de pestaña, se para */
function spSync(){if(!SP.on)return;const cur=S.stage?S.stage.ids[S.stage.idx]:(S.tab==="songs"?S.songId:null);if(cur!==SP.id)Eng.stop()}
/* al transportar mientras suena, cambia los acordes sin cortar */
function spRetune(id){
  if(!SP.on||SP.id!==id||Eng.mode!=="wheel"||!Eng.cfg)return;
  const s=Store.get("songs",id);if(!s)return;const n=trOf(s);
  Eng.cfg.beatChords=expandBars(songBars(s,n,songFlats(s,n),SP.meter),SP.meter).chords;
}

function noteHTML(t){const lines=String(t).split(/\n/);let h="",inUl=false;for(const l of lines){if(/^\s*[-•]\s+/.test(l)){if(!inUl){h+='<ul class="nl">';inUl=true}h+="<li>"+esc(l.replace(/^\s*[-•]\s+/,""))+"</li>"}else{if(inUl){h+="</ul>";inUl=false}if(l.trim())h+="<p style=\"margin:0\">"+esc(l)+"</p>"}}if(inUl)h+="</ul>";return `<div style="display:flex;flex-direction:column;gap:4px">${h}</div>`}

/* LETRAS (sin acordes, con etiquetas «apta para») */
const PALOS=["Tangos","Tientos","Soleá","Bulerías","Alegrías","Seguiriyas","Fandangos","Malagueñas","Verdiales","Jabegotes","Granaínas","Tarantos","Tarantas","Cartageneras","Cantiñas","Rumba","Tanguillos","Sevillanas","Peteneras","Guajiras","Farruca","Martinete","Zambra","Nanas","Villancicos"];
const ESTILOS=["Copla","Bolero","Balada","Pop","Rock","Folk","Blues","Jazz","Bossa nova","Gypsy swing","Reggae","Cumbia","Vals","Canción de autor","Infantil","Tango argentino","Habanera"];
const lyricTitle=l=>(l.title||"").trim()||String(l.text||"").split(/\n/).map(x=>x.trim()).find(x=>x&&!x.startsWith("#"))||"Sin título";
const lyricsSorted=()=>Store.list("lyrics").sort((a,b)=>lyricTitle(a).localeCompare(lyricTitle(b),"es"));
const lyricTags=()=>{const m=new Map();Store.list("lyrics").forEach(l=>(l.tags||[]).forEach(t=>m.set(t,(m.get(t)||0)+1)));return [...m.entries()].sort((a,b)=>a[0].localeCompare(b[0],"es"))};
const tkey=t=>String(t).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
function canonTag(t){t=String(t||"").replace(/\s+/g," ").trim();if(!t)return "";t=t[0].toUpperCase()+t.slice(1);const known=[...PALOS,...ESTILOS,...lyricTags().map(x=>x[0])];return known.find(k=>tkey(k)===tkey(t))||t}

function viewLyrics(){
  const all=lyricsSorted();const q=tkey(S.lq.trim());const tags=lyricTags();
  if(S.ltag!=="all"&&S.ltag!=="_fav"&&!tags.some(([t])=>t===S.ltag))S.ltag="all";

    if(S.ltag==="_fav"&&!l.fav)return false;

    return !q||tkey(lyricTitle(l)+" "+(l.author||"")+" "+(l.text||"")+" "+(l.tags||[]).join(" ")).includes(q);
  };
  if(!all.length)return `<div class="empty"><h3>Aún no hay letras</h3><p>Aquí guardas letras sin acordes: coplas de tangos, bulerías o soleás, poemas para cantar, letras de cualquier estilo. Cada una puede llevar una o varias etiquetas de «apta para» (palos y estilos) para encontrarlas cuando quieras cantar algo en concreto.</p><button class="btn pri" data-act="newLyric">+ Añadir la primera letra</button></div>`;
  const list=all.filter(hit);const cur=S.lyricId?Store.get("lyrics",S.lyricId):null;const nfav=all.filter(l=>l.fav).length;
  const chip=(k,l,n)=>`<button class="chip" aria-pressed="${S.ltag===k}" data-act="lyricTag" data-t="${esc(k)}">${esc(l)} <span class="muted">${n}</span></button>`;
  return `<section class="songs${cur?" has-song":""}">
   <aside class="list-pane">

const INST={

/* digitaciones (en notas escritas) */
const TPT={54:"123",55:"13",56:"23",57:"12",58:"1",59:"2",60:"0",61:"123",62:"13",63:"23",64:"12",65:"1",66:"2",67:"0",68:"23",69:"12",70:"1",71:"2",72:"0",73:"12",74:"1",75:"2",76:"0",77:"1",78:"2",79:"0",80:"23",81:"12",82:"1",83:"2",84:"0"};

/* ---- texto ⇄ notas ---- */
const LAT_PC={do:0,re:2,mi:4,fa:5,sol:7,la:9,si:11},US_PC={c:0,d:2,e:4,f:5,g:7,a:9,b:11};
const MN_RE=/^(do|re|mi|fa|sol|la|si|[a-g])([#b♯♭]?)(\d)?(?::(\d+(?:[.,]\d+)?(?:\/\d+)?))?$/i;

/* sin número de octava, cada nota va a la octava más cercana a la anterior */
function parseMel(text,ref){
  const ev=[],bad=[];let prev=ref||67;
  for(const tok of String(text||"").replace(/\|/g," ").split(/\s+/).filter(Boolean)){
    let m=tok.match(MR_RE);

function fmtDur(d){for(const den of [1,2,4,3,8,6,12,16]){const n=d*den;if(Math.abs(n-Math.round(n))<1e-6)return den===1?String(Math.round(n)):Math.round(n)+"/"+den}return String(+d.toFixed(3))}

function melToText(ev,o){
  o=o||{};const tr=o.tr||0,bl=o.barLen||0;let out="",pos=0,next=bl,bars=0;

function bandSVG(band,p,cx,y0,tp){

/* devuelve una o varias filas <svg>; cada nota es un <g data-i> que se puede tocar */

const Mel={on:false,g:null,timer:0,sched:[],end:0,opts:null,
  voice(t,m,d,timbre,dest,vel){
    const c=Eng.ctx,f=440*Math.pow(2,(m-69)/12),g=c.createGain();vel=vel||.8;g.connect(dest);const dur=Math.max(.06,d);
    if(timbre==="pluck"){const o=c.createOscillator(),lp=c.createBiquadFilter();o.type="sawtooth";o.frequency.value=f;lp.type="lowpass";lp.frequency.setValueAtTime(3200,t);lp.frequency.exponentialRampToValueAtTime(500,t+Math.min(dur,.8));g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22*vel,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(dur,.25)+.35);o.connect(lp).connect(g);o.start(t);o.stop(t+Math.max(dur,.25)+.4);return}
    const o=c.createOscillator(),lp=c.createBiquadFilter();lp.type="lowpass";o.frequency.value=f;
    if(timbre==="brass"){o.type="sawtooth";lp.frequency.setValueAtTime(f*1.5,t);lp.frequency.linearRampToValueAtTime(f*5,t+.06);lp.frequency.linearRampToValueAtTime(f*3.5,t+.25)}

    const lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=5.2;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(f*.006,t+Math.min(.5,dur*.7)+.01);lfo.connect(lg).connect(o.frequency);
    const a=timbre==="brass"?.035:.02,rel=.06,peak=(timbre==="whistle"?.3:.2)*vel,hold=Math.max(a+.02,dur*.92-rel);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(peak*.8,t+hold);g.gain.exponentialRampToValueAtTime(.0001,t+hold+rel);
    o.connect(lp).connect(g);o.start(t);lfo.start(t);o.stop(t+hold+rel+.05);lfo.stop(t+hold+rel+.05);
  },
  click(t,hi,dest){const c=Eng.ctx,o=c.createOscillator(),g=c.createGain();o.frequency.value=hi?1760:1180;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.001);g.gain.exponentialRampToValueAtTime(.0001,t+.05);o.connect(g).connect(dest);o.start(t);o.stop(t+.07)},
  note(m,timbre){if(m==null||!Eng.ensure())return;this.voice(Eng.ctx.currentTime+.01,m,.45,timbre||"voice",Eng.master)},

  play(ev,o){

    const spb=60/o.bpm,bl=Math.round(o.barLen||4);let t=c.currentTime+.08;

/* ---- cuantización común: notas {p,on,off} en tiempos (negras) → eventos {p,d} ---- */
const REPR=[4,3,2,1.5,4/3,1,.75,2/3,.5,1/3,.25];
function quantizeNotes(notes,o){
  const g=o.grid||.25,bl=o.barLen||4,q=x=>Math.round(x/g)*g;
  const allow=REPR.filter(x=>Math.abs(x/g-Math.round(x/g))<1e-6).sort((a,b)=>b-a);
  const ns=notes.filter(n=>n.p!=null).map(n=>({p:n.p,on:q(n.on),off:Math.max(q(n.off),q(n.on)+g)})).sort((a,b)=>a.on-b.on);
  const out=[];
  for(const n of ns){const l=out[out.length-1];if(l&&n.on<=l.on+1e-6){if(n.off-n.on>l.off-l.on)out[out.length-1]=n;continue}out.push(n)}
  for(let i=0;i<out.length-1;i++){const a=out[i],b=out[i+1];if(a.off>b.on||b.on-a.off<=g+1e-6)a.off=b.on}
  if(!out.length)return [];
  const ev=[],push=(p,d)=>{let first=true;while(d>1e-6){const r=allow.find(x=>x<=d+1e-6)||d;ev.push({p:first?p:null,d:r});d-=r;first=false}};
  let t=o.lead?out[0].on-(((out[0].on%bl)+bl)%bl):out[0].on;
  for(const n of out){if(n.on-t>1e-6)push(null,n.on-t);push(n.p,n.off-n.on);t=n.off}
  return ev;
}

/* ---- ABC (thesession.org, folk…) ---- */
const ABC_MODE={"":0,maj:0,major:0,ion:0,mix:1,dor:2,m:3,min:3,minor:3,aeo:3,phr:4,loc:5,lyd:-1};

  "FCGDAEB".slice(0,Math.max(0,n)).split("").forEach(l=>acc[l]=1);"BEADGCF".slice(0,Math.max(0,-n)).split("").forEach(l=>acc[l]=-1);

    for(const ln of blk.split("\n")){

      if(!inBody){if(m){const v=m[2].trim();if(m[1]==="T"&&!h.T)h.T=v;else if(m[1]==="M")h.M=v;else if(m[1]==="L")h.L=v;else if(m[1]==="Q")h.Q=v;else if(m[1]==="R")h.R=v;else if(m[1]==="K"){h.K=v;inBody=true}}continue}
      if(m){if("KLM".includes(m[1]))body.push({f:m[1],v:m[2].trim()});continue}
      body.push(l);
    }
    let meter=h.M==="C"?"4/4":h.M==="C|"?"2/2":/^\d+\/\d+$/.test(h.M)?h.M:"4/4";
    let L=fracVal(h.L);if(isNaN(L))L=fracVal(meter)<.75?1/16:1/8;
    let bpm=100;if(h.Q){const q=h.Q.match(/(\d+)\s*\/\s*(\d+)\s*=\s*(\d+)/);if(q)bpm=Math.round(+q[3]*(q[1]/q[2])*4);else{const n=h.Q.match(/(\d+)/);if(n)bpm=Math.round(+n[1]*L*4)}}

    const ev=[];let repStart=0,end1=null,tup=null,broken=null,tie=false;
    const add=(p,d)=>{

      if(broken!=null){d*=broken;broken=null}
      const last=ev[ev.length-1];
      if(tie&&last&&p!=null&&last.p===p){last.d+=d;tie=false;return}
      tie=false;ev.push({p,d});
    };
    const repEnd=()=>{const seg=ev.slice(repStart,end1??ev.length).map(e=>({...e}));ev.push(...seg);repStart=ev.length;end1=null};

}

/* ---- MIDI ---- */
function midiParse(buf,fname){
  const d=new DataView(buf);let p=0;const str=n=>{let s="";for(let i=0;i<n;i++)s+=String.fromCharCode(d.getUint8(p+i));return s};
  if(str(4)!=="MThd")throw new Error("No es un archivo MIDI");
  const ntr=d.getUint16(10),div=d.getUint16(12);if(div&0x8000)throw new Error("Este MIDI usa tiempo SMPTE, que no está soportado");
  p=8+d.getUint32(4);let tempo=0,ts=null;const voices=new Map();
  for(let t=0;t<ntr&&p+8<=d.byteLength;t++){
    const id=str(4),len=d.getUint32(p+4);p+=8;const end=Math.min(d.byteLength,p+len);if(id!=="MTrk"){p=end;continue}
    let tick=0,rs=0,tname="";const open={};
    const vlq=()=>{let v=0,b;do{b=d.getUint8(p++);v=(v*128)+(b&127)}while(b&128&&p<end);return v};
    while(p<end){
      tick+=vlq();let st=d.getUint8(p);
      if(st===0xFF){p++;const ty=d.getUint8(p++),l=vlq();if(ty===0x51&&!tempo)tempo=(d.getUint8(p)<<16)|(d.getUint8(p+1)<<8)|d.getUint8(p+2);else if(ty===0x58&&!ts)ts=d.getUint8(p)+"/"+(2**d.getUint8(p+1));else if(ty===0x03){let s="";for(let i=0;i<l;i++)s+=String.fromCharCode(d.getUint8(p+i));tname=s.trim()}p+=l;continue}
      if(st===0xF0||st===0xF7){p++;p+=vlq();continue}
      if(st&0x80){p++;rs=st}else st=rs;
      const ty=st&0xF0,ch=st&15;
      if(ty===0x90||ty===0x80){const n=d.getUint8(p),v=d.getUint8(p+1);p+=2;if(ch===9)continue;const k=t+":"+ch;if(!voices.has(k))voices.set(k,{t,ch,name:"",notes:[]});const V=voices.get(k);
        const ok=ch+":"+n;if(ty===0x90&&v>0)(open[ok]=open[ok]||[]).push(tick);else{const o=open[ok];if(o&&o.length)V.notes.push({p:n,on:o.shift()/div,off:tick/div})}}
      else if(ty===0xC0||ty===0xD0)p+=1;else p+=2;
    }
    for(const V of voices.values())if(V.t===t&&!V.name)V.name=tname;
    p=end;
  }
  const bpm=tempo?Math.round(60e6/tempo):120,timeSig=ts&&/^\d+\/(2|4|8|16)$/.test(ts)?ts:"4/4",bl=barLenOf(timeSig);
  const sky=ns=>{ns=ns.slice().sort((a,b)=>a.on-b.on||b.p-a.p);const o=[];for(const n of ns){const l=o[o.length-1];if(l&&n.on<l.off-1e-6){if(n.on-l.on<.02||n.p<l.p)continue;l.off=n.on}o.push({...n})}return o};
  const vs=[...voices.values()].filter(v=>v.notes.length).map(v=>{const notes=sky(v.notes);const ps=notes.map(n=>n.p).sort((a,b)=>a-b);return {name:v.name||("Canal "+(v.ch+1)),notes,med:ps[ps.length>>1],n:notes.length}});
  if(!vs.length)throw new Error("Este MIDI no tiene notas (o solo tiene percusión)");
  const maxN=Math.max(...vs.map(v=>v.n));const cand=vs.filter(v=>v.n>=Math.max(4,maxN*.25));const best=(cand.length?cand:vs).reduce((a,b)=>b.med>a.med?b:a);
  const base=String(fname||"MIDI").replace(/\.(mid|midi)$/i,"");
  return vs.map(v=>({title:vs.length>1?base+" · "+v.name:base,ev:quantizeNotes(v.notes,{grid:.25,barLen:bl,lead:true}),bpm,timeSig,tags:[],src:"MIDI",on:v===best}));
}

/* ---- detección de tono (YIN) ---- */
function yinFrame(x,off,W,tmin,tmax,d,sr){
  for(let t=1;t<=tmax;t++){let s=0;for(let i=0;i<W;i++){const v=x[off+i]-x[off+i+t];s+=v*v}d[t]=s}
  let run=0;for(let t=1;t<=tmax;t++){run+=d[t];d[t]=run?d[t]*t/run:1}
  let tau=-1;for(let t=tmin;t<=tmax;t++){if(d[t]<.15){while(t+1<=tmax&&d[t+1]<d[t])t++;tau=t;break}}
  if(tau<0){tau=tmin;for(let t=tmin+1;t<=tmax;t++)if(d[t]<d[tau])tau=t}
  let bt=tau;if(tau>tmin&&tau<tmax){const a=d[tau-1],b=d[tau],c=d[tau+1],den=a-2*b+c;if(den>0)bt=tau+.5*(a-c)/den}
  return {f:sr/bt,conf:1-d[tau]};
}
async function to16k(ch,sr){
  if(sr===16000)return ch;const oc=new OfflineAudioContext(1,Math.ceil(ch.length*16000/sr),16000);const b=oc.createBuffer(1,ch.length,sr);b.copyToChannel(ch,0);
  const s=oc.createBufferSource();s.buffer=b;s.connect(oc.destination);s.start();return (await oc.startRendering()).getChannelData(0);
}
async function pitchTrack(pcm,sr,prog){
  const x=await to16k(pcm,sr),SR=16000,W=512,H=160,tmin=6,tmax=320,n=Math.max(0,Math.floor((x.length-W-tmax)/H)),fr=new Array(n),d=new Float32Array(tmax+2);
  for(let i=0;i<n;i++){
    const off=i*H;let e=0;for(let j=0;j<W;j++){const v=x[off+j];e+=v*v}const rms=Math.sqrt(e/W);
    let f=0,conf=0;if(rms>.002){const r=yinFrame(x,off,W,tmin,tmax,d,SR);f=r.f;conf=r.conf}
    fr[i]={t:(off+W/2)/SR,rms,f,conf};
    if(i%250===249){prog&&prog(i/n);await new Promise(r=>setTimeout(r))}
  }
  return fr;
}
/* de fotogramas a notas {p, on, off} (segundos) */
function segmentNotes(fr,o){
  o=o||{};if(!fr.length)return [];
  const rs=fr.map(f=>f.rms).sort((a,b)=>a-b),floor=rs[Math.floor(rs.length*.05)]||0,peak=rs[Math.floor(rs.length*.98)]||0,thr=Math.min(peak*.2,Math.max(.006,floor*2.5,peak*.05));
  const ck=o.clicks||[];
  const V=fr.map(f=>{
    let v=f.rms>thr&&f.conf>.7&&f.f>55&&f.f<2700;
    if(v&&ck.length)for(const c of ck){if(f.t>=c-.02&&f.t<=c+.1){if(Math.abs(1200*Math.log2(f.f/1760))<90||Math.abs(1200*Math.log2(f.f/1180))<90)v=false;break}}
    return v?69+12*Math.log2(f.f/440):null});
  const M=V.map((m,i)=>{if(m==null)return null;const w=[];for(let k=-2;k<=2;k++){const q=V[i+k];if(q!=null)w.push(q)}w.sort((a,b)=>a-b);return w[w.length>>1]});
  const notes=[],med=a=>{const s=a.slice().sort((x,y)=>x-y);return s[s.length>>1]};
  let cur=null,gap=0,dev=0,pendAtt=false;
  const close=(endI)=>{if(!cur)return;const len=endI-cur.s;if(len>=7){const a=cur.ms,cut=Math.floor(a.length*.15);const core=a.slice(cut,a.length-cut);notes.push({m:med(core.length?core:a),on:fr[cur.s].t,off:fr[Math.min(endI,fr.length-1)].t,att:cur.att})}cur=null};
  for(let i=0;i<M.length;i++){
    const m=M[i],r=fr[i].rms;
    if(m==null){gap++;if(cur){if(r<cur.peak*.35)cur.dip=true;if(gap>=3){pendAtt=cur.dip;close(i-gap+1)}}continue}
    /* hueco corto con bajada de energía = nueva articulación (ta-ta) aunque sea la misma nota */
    if(cur&&gap>0&&cur.dip){close(i-gap);cur={s:i,ms:[m],rr:[r],peak:r,low:0,att:true,dip:false};gap=0;dev=0;continue}
    gap=0;if(cur)cur.dip=false;
    if(!cur){cur={s:i,ms:[m],rr:[r],peak:r,low:0,att:pendAtt,dip:false};pendAtt=false;dev=0;continue}
    if(Math.abs(m-med(cur.ms.slice(-15)))>.7){if(++dev>=3){const keep=cur.ms.splice(cur.ms.length-(dev-1));close(i-dev+1);cur={s:i-dev+1,ms:keep.concat(m),rr:[r],peak:r,low:0,att:false,dip:false};dev=0;continue}}else dev=0;
    const rp=Math.max(...cur.rr.slice(-20));
    if(r<rp*.45){if(!cur.low||r<fr[cur.lowAt].rms)cur.lowAt=i;cur.low++}
    else if(r>rp*.75){if(cur.low>=1&&cur.lowAt-cur.s>8){const at=cur.lowAt;close(at);cur={s:at,ms:[m],rr:[r],peak:r,low:0,att:true,dip:false};continue}cur.low=0}
    cur.peak=Math.max(cur.peak,r);cur.ms.push(m);cur.rr.push(r);
  }
  if(cur)close(M.length-1);
  if(!notes.length)return [];
  const offs=notes.map(n=>n.m-Math.round(n.m)).sort((a,b)=>a-b),tune=offs[offs.length>>1];
  const out=[];for(const n of notes){const p=Math.round(n.m-tune),l=out[out.length-1];if(l&&l.p===p&&!n.att&&n.on-l.off<.05)l.off=n.off;else out.push({p,on:n.on,off:n.off})}
  return out;
}

const Pool={ws:[],busy:[],q:[],jobs:{},n:0,inline:null,chain:null,
  init(){
    if(this.ws.length||this.inline)return;
    try{
      const src=DSP_LIB.toString()+"\n("+DSP_WORKER_MAIN.toString()+")();";
      const url=URL.createObjectURL(new Blob([src],{type:"text/javascript"}));
      const n=Math.max(1,Math.min(4,(navigator.hardwareConcurrency||2)-1));
      for(let i=0;i<n;i++){const w=new Worker(url);w.onmessage=e=>this.msg(i,e.data);w.onerror=()=>this.fail();this.ws.push(w);this.busy.push(0)}
    }catch(e){this.inline=DSP_LIB()}
  },
  run(op,payload,onProg){this.init();return new Promise((res,rej)=>{const id=++this.n;const j=this.jobs[id]={id,op,payload,res,rej,onProg};if(this.inline)this.runInline(j);else{this.q.push(id);this.pump()}})},
  pump(){for(let i=0;i<this.ws.length;i++){if(this.busy[i]||!this.q.length)continue;const id=this.q.shift(),j=this.jobs[id];if(!j)continue;this.busy[i]=id;this.ws[i].postMessage({id,op:j.op,...j.payload})}},
  msg(i,d){const j=this.jobs[d.id];if(d.progress!=null){j&&j.onProg&&j.onProg(d.progress);return}this.busy[i]=0;if(j){delete this.jobs[d.id];d.error?j.rej(new Error(d.error)):j.res(d.out)}this.pump()},
  fail(){if(this.inline)return;this.ws.forEach(w=>{try{w.terminate()}catch(e){}});this.ws=[];this.q=[];this.inline=DSP_LIB();Object.values(this.jobs).forEach(j=>this.runInline(j))},
  runInline(j){this.chain=(this.chain||Promise.resolve()).then(()=>new Promise(r=>setTimeout(r,30))).then(()=>{const L=this.inline,d=j.payload;try{const out=j.op==="sep"?L.separate(d.L,d.R,d.sr,d.mode,d.opts,j.onProg):[L.shift(d.chs,d.p,d.t,j.onProg)];delete this.jobs[j.id];j.res(out)}catch(e){delete this.jobs[j.id];j.rej(e)}})}
};

async function makeDemo(sr){

  const env=(g,t,pk,a,d)=>{g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(pk,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)};

  for(let L=0;L<2;L++){const T=L*9.6+.2;
    chords.forEach((ch,i)=>{const t0=T+i*bar;
      for(let b=0;b<4;b++){const t=t0+b*beat;ch.forEach((m,j)=>pluck(t+j*.012,mtof(m),b===0?1:.6));if(b%2)ch.slice(1).forEach((m,j)=>pluck(t+beat/2+j*.01,mtof(m),.4))}
      const o=ctx.createOscillator(),g=ctx.createGain(),fl=ctx.createBiquadFilter();o.type="triangle";o.frequency.value=mtof(bass[i]);fl.type="lowpass";fl.frequency.value=500;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.4,t0+.01);g.gain.exponentialRampToValueAtTime(.12,t0+bar*.8);g.gain.exponentialRampToValueAtTime(.0001,t0+bar*.95);o.connect(fl).connect(g).connect(gC);o.start(t0);o.stop(t0+bar);

    });

      o.type="sawtooth";o.frequency.value=mtof(m);lfo.frequency.value=5.4;lg.gain.value=14;lfo.connect(lg).connect(o.detune);
      [[650,5,1],[1100,6,.6],[2500,7,.3]].forEach(([f,q,a])=>{const bp=ctx.createBiquadFilter();bp.type="bandpass";bp.frequency.value=f;bp.Q.value=q;const ga=ctx.createGain();ga.gain.value=a;o.connect(bp).connect(ga).connect(out)});

const loopOn=()=>ST.loop&&ST.A!=null&&ST.B!=null&&ST.B>ST.A+.1;
function stPlay(){
  if(!ST.stems||ST.busy||!Eng.ensure())return;stStopNodes();
  const c=Eng.ctx,out=stOut(),T=ST.tempo,dur=ST.src.dur;let off=ST.off;if(off>=dur-.05)off=0;
  const lp=loopOn();if(lp&&(off<ST.A||off>=ST.B))off=ST.A;
  const when=c.currentTime+.06;
  ST.stems.forEach((s,i)=>{const src=c.createBufferSource();src.buffer=s.buf;const g=c.createGain();g.gain.value=stEff(i);src.connect(g).connect(out);if(lp){src.loop=true;src.loopStart=ST.A/T;src.loopEnd=ST.B/T}src.start(when,Math.min(off/T,s.buf.duration-.01));ST.srcs.push(src);ST.gains.push(g)});
  const first=ST.srcs[0];first.onended=()=>{if(ST.playing&&ST.srcs[0]===first){ST.playing=false;ST.off=0;stStopNodes();stPaintTransport()}};
  ST.t0=when;ST.off=off;ST.playing=true;stPaintTransport();stTick();
}
function stPos(){if(!ST.src)return 0;if(!ST.playing)return ST.off;let p=ST.off+Math.max(0,Eng.ctx.currentTime-ST.t0)*ST.tempo;if(loopOn()&&p>ST.B)p=ST.A+((p-ST.A)%(ST.B-ST.A));return Math.min(p,ST.src.dur)}
function stStopNodes(){ST.srcs.forEach(s=>{try{s.onended=null;s.stop()}catch(e){}});ST.srcs=[];ST.gains=[]}
function stStop(){if(ST.playing)ST.off=stPos();ST.playing=false;stStopNodes();stPaintTransport()}
function stSeek(t){if(!ST.src)return;const was=ST.playing;stStopNodes();ST.playing=false;ST.off=Math.max(0,Math.min(t,ST.src.dur));if(was)stPlay();else stPaintTransport()}
function stApplyGains(){if(!Eng.ctx)return;ST.gains.forEach((g,i)=>g.gain.setTargetAtTime(stEff(i),Eng.ctx.currentTime,.015))}
function stTick(){cancelAnimationFrame(ST.raf);const f=()=>{if(!ST.playing)return;stPaintTime();ST.raf=requestAnimationFrame(f)};ST.raf=requestAnimationFrame(f)}

  const cv=$("#stWave");cv.onclick=e=>{if(!ST.src)return;const r=cv.getBoundingClientRect();stSeek((e.clientX-r.left)/r.width*ST.src.dur)};

function stRenderMixer(){
  const box=$("#stMixer");if(!box)return;const s=ST.src;
  const avail={orig:!!s&&s.kind==="mix",voz:!!s&&s.kind==="mix"&&!s.mono,pan:!!s&&s.kind==="mix"&&!s.mono,files:!!s&&s.kind==="stems"};
  $("#stModes").innerHTML=Object.entries(MODES).filter(([k])=>k!=="files"||avail.files).map(([k,l])=>`<button class="chip" aria-pressed="${ST.mode===k}" data-act="stMode" data-m="${k}" ${avail[k]&&!ST.busy?"":"disabled"}>${l}</button>`).join("");
  $("#stPrecRow").hidden=ST.mode!=="voz";
  $("#stModeHelp").innerHTML=s&&s.mono&&s.kind==="mix"?`<span class="warn">Esta grabación es mono.</span> Las dos separaciones necesitan una mezcla en estéreo; aquí solo puedes cambiar el tono y la velocidad.`:esc(MODE_HELP[ST.mode]);
  const stems=ST.stems||[];
  const vi=stems.findIndex(x=>/^voz/i.test(x.name));
  $("#stQuick").innerHTML=vi>=0&&stems.length>1?`<button class="btn sm" data-act="stQuick" data-q="novoz">Quitar voz</button><button class="btn sm" data-act="stQuick" data-q="solovoz">Solo voz</button><button class="btn sm ghost" data-act="stQuick" data-q="todo">Todo</button>`:"";
  box.innerHTML=stems.length?stems.map(x=>{const m=mixOf(x.name);return `<div class="mx"><span class="nm">${esc(x.name)}</span><button class="mbtn${m.m?" on":""}" data-act="stMute" data-n="${esc(x.name)}" aria-pressed="${m.m}" title="Silenciar">M</button><button class="mbtn${m.s?" on":""}" data-act="stSolo" data-n="${esc(x.name)}" aria-pressed="${m.s}" title="Solo esta pista">S</button><input type="range" min="0" max="1.5" step=".05" value="${m.g}" data-stgain="${esc(x.name)}" aria-label="Volumen de ${esc(x.name)}"></div>`}).join(""):`<p class="muted" style="margin:0">${ST.busy?"Procesando…":"Aquí aparecerán las pistas con su volumen."}</p>`;
  $$("[data-stgain]",box).forEach(r=>r.oninput=e=>{mixOf(r.dataset.stgain).g=+e.target.value;stApplyGains()});
  const ss=$("#stSaveStems");if(ss)ss.disabled=!(ST.stems&&ST.stems.length>1&&!ST.busy);
}
function stPaintStatus(){
  const el=$("#stStatus");if(!el)return;
  el.innerHTML=ST.busy?`<span>${esc(ST.msg)}</span><span class="pbar"><i id="stProg" style="width:${Math.round(ST.prog*100)}%"></i></span>`:ST.msg?`<span class="${ST.err?"warn":""}">${esc(ST.msg)}</span>`:"";
  const pb=$("#stPlay");if(pb)pb.disabled=!ST.stems||ST.busy;
  $$("#stModes .chip").forEach(c=>c.disabled=ST.busy||c.disabled);
  if(!ST.busy)stRenderModesOnly();
}
function stRenderModesOnly(){const m=$("#stModes");if(!m||!ST.src)return;const s=ST.src;const avail={orig:s.kind==="mix",voz:s.kind==="mix"&&!s.mono,pan:s.kind==="mix"&&!s.mono,files:s.kind==="stems"};$$(".chip",m).forEach(c=>c.disabled=!avail[c.dataset.m])}
function stPaintTransport(){
  const b=$("#stPlay");if(b){b.textContent=ST.playing?"❚❚ Pausa":"▶ Reproducir";b.disabled=!ST.stems||ST.busy}
  const mp=$("#miniPlay");if(mp)mp.hidden=!(ST.playing&&S.tab!=="studio");
  const lb=$("#stLoopBtn");if(lb)lb.classList.toggle("on",ST.loop);
  const sv=$("#stShiftV");if(sv)sv.textContent=fmtSt(ST.shift);
  const song=ST.src&&ST.src.songId?Store.get("songs",ST.src.songId):null;
  const kt=$("#stKeyTag");if(kt){if(song&&keyOf(song)){kt.hidden=false;kt.innerHTML=ST.shift?`${pretty(keyOf(song))} → <b>${pretty(trKey(keyOf(song),ST.shift))}</b>`:`Tono <b>${pretty(keyOf(song))}</b>`}else kt.hidden=true}
  const mk=$("#stMyKey");if(mk){mk.disabled=!song;mk.textContent=song&&(+song.myShift||0)===ST.shift&&ST.shift!==0?"✓ Es tu tono":"Guardar como mi tono"}
  const sc=$("#stSeeChords");if(sc)sc.disabled=!song;
  stPaintTime();
}
function stPaintTime(){
  const t=$("#stTime");if(t&&ST.src)t.textContent=`${fmtT(stPos())} / ${fmtT(ST.src.dur)}${ST.A!=null||ST.B!=null?`  ·  A ${fmtT(ST.A)} – B ${fmtT(ST.B)}`:""}`;
  drawWave();
}
function drawWave(){
  const cv=$("#stWave");if(!cv)return;const dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;if(!W)return;
  if(cv.width!==Math.round(W*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
  const g=cv.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
  if(!ST.src||!ST.peaks)return;
  const cs=getComputedStyle(document.documentElement),col=k=>cs.getPropertyValue(k).trim()||"#888";
  const dur=ST.src.dur,x=t=>t/dur*W;
  if(ST.A!=null||ST.B!=null){const a=ST.A??0,b=ST.B??dur;g.fillStyle=col("--hl");g.fillRect(x(a),0,Math.max(2,x(b)-x(a)),H)}
  const pk=ST.peaks,n=pk.length,bw=W/n,pos=x(stPos());
  for(let i=0;i<n;i++){const xx=i*bw,h=Math.max(1,pk[i]*(H-10));g.fillStyle=xx<pos?col("--brass"):col("--muted");g.globalAlpha=xx<pos?1:.45;g.fillRect(xx,(H-h)/2,Math.max(1,bw-.6),h)}
  g.globalAlpha=1;g.fillStyle=col("--ink");g.fillRect(pos-1,0,2,H);
  g.font="600 11px "+(cs.getPropertyValue("--f-mono")||"monospace");
  [["A",ST.A],["B",ST.B]].forEach(([l,t])=>{if(t==null)return;g.fillStyle=col("--chord");g.fillRect(x(t)-1,0,2,H);g.fillText(l,Math.min(W-10,x(t)+4),12)});
}
async function stSaveMix(){
  const id=$("#stSaveSong").value;if(!id){toast("Elige la canción donde guardarla");$("#stSaveSong").focus();return}
  if(!ST.stems||ST.busy)return;
  const song=clone(Store.get("songs",id));delete song.id;
  const n=ST.stems.reduce((m,s)=>Math.max(m,s.buf.length),0),L=new Float32Array(n),R=new Float32Array(n);
  ST.stems.forEach((s,i)=>{const g=stEff(i);if(!g)return;const a=s.buf.getChannelData(0),b=s.buf.numberOfChannels>1?s.buf.getChannelData(1):a;for(let j=0;j<a.length;j++){L[j]+=a[j]*g;R[j]+=b[j]*g}});
  let pk=0;for(let j=0;j<n;j+=3){const v=Math.max(Math.abs(L[j]),Math.abs(R[j]));if(v>pk)pk=v}if(pk>.98){const k=.98/pk;for(let j=0;j<n;j++){L[j]*=k;R[j]*=k}}
  const parts=[];if(ST.shift)parts.push("tono "+fmtSt(ST.shift));if(ST.tempo!==1)parts.push("velocidad "+Math.round(ST.tempo*100)+"%");
  const off=ST.stems.filter((s,i)=>!stEff(i)).map(s=>s.name.replace(/ \(estimada\)/,"").toLowerCase());if(off.length)parts.push("sin "+off.join(", "));
  const label=parts.length?parts.join(" · "):"versión original";
  stBusy("Guardando la mezcla…");
  try{
    if(!fileRef(song.source)&&ST.src.kind==="mix"){
      if(ST.src.songId===id&&fileRef(song.backing))song.source=song.backing;
      else if(ST.src.origin!=="demo"){ST.msg="Guardando el audio original…";stPaintStatus();song.source=await storeChannels(ST.src.mix[1]===ST.src.mix[0]?[ST.src.mix[0]]:ST.src.mix,ST.src.sr,ST.src.title,p=>stProg(p*.5))}
    }
    ST.msg="Guardando la mezcla…";stPaintStatus();
    song.backing=await storeChannels([L,R],ST.src.sr,song.title+" · "+label,p=>stProg(.5+p*.5));
    song.backingNote=label;
    await Store.put("songs",id,song);
    ST.busy=false;ST.msg="Guardada en «"+song.title+"» ("+label+"). Ya suena en el modo escenario.";stPaintStatus();stRenderMixer();
  }catch(e){stFail("No se pudo guardar: "+(e.code||e.message))}
}
async function stSaveStems(){
  const id=$("#stSaveSong").value;if(!id){toast("Elige la canción donde guardarlas");$("#stSaveSong").focus();return}
  const base=ST.base[modeKey()];if(!base||base.length<2)return;
  const song=clone(Store.get("songs",id));delete song.id;
  stBusy("Guardando "+base.length+" pistas…");
  try{
    const refs=[];for(let i=0;i<base.length;i++){ST.msg=`Guardando «${base[i].name}» (${i+1} de ${base.length})…`;stPaintStatus();const r=await storeChannels(base[i].ch,ST.src.sr,base[i].name,p=>stProg((i+p)/base.length));refs.push({...r,name:base[i].name.replace(/ \(estimada\)/,"")})}
    song.stems=refs;await Store.put("songs",id,song);
    ST.busy=false;ST.msg=`${refs.length} pistas guardadas en «${song.title}».`;stPaintStatus();stRenderMixer();
  }catch(e){stFail("No se pudieron guardar: "+(e.code||e.message))}
}
async function storeChannels(chs,sr,name,onProg){
  if(Store.assets){
    try{const blob=await WEBM.encode(chs,sr,onProg);if(blob.size<=20*1024*1024){const r=await Store.assets.upload(blob);return {kind:"asset",assetId:r.id,url:r.url,name}}toast("Ocupa más de 20 MB; se guarda solo en este dispositivo")}
    catch(e){if(e.message!=="sin-codificador")toast("No se pudo subir a la nube ("+(e.code||e.message)+"); se guarda en este dispositivo")}
  }
  let blob;try{blob=await WEBM.encode(chs,sr,onProg)}catch(e){blob=WEBM.wav(chs,sr)}
  const key=uid("t");await IDB.put(key,blob);return {kind:"local",localKey:key,name};
}

async function storeTrack(file){
  const ext=file.name.toLowerCase().split(".").pop();
  const cloudType=/^(m4a|mp4|aac|m4b)$/.test(ext)?"video/mp4":/^webm$/.test(ext)?"video/webm":null;
  if(cloudType&&Store.assets&&file.size<=20*1024*1024){try{const r=await Store.assets.upload(new Blob([file],{type:cloudType}));return {kind:"asset",assetId:r.id,url:r.url,name:file.name}}catch(e){}}
  try{const d=await decodeAB(await file.arrayBuffer());return await storeChannels(d.ch[1]===d.ch[0]?[d.ch[0]]:d.ch,d.sr,file.name)}
  catch(e){const key=uid("t");await IDB.put(key,file);return {kind:"local",localKey:key,name:file.name}}
}
