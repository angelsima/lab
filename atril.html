/* ---------- colocador de acordes ---------- */
const CE={on:false,lines:[],sel:null,selL:-1,cur:null,apply:null,title:"",dirty:false,confirm:false,font:15,drag:null};
function ceParse(body){
  return normBody(body).split(/\r?\n/).map(raw=>{
    const l=raw.replace(/\s+$/,"");
    if(!l.trim()||/^\s*#/.test(l)||/^\s*\{.*\}\s*$/.test(l))return {raw:l};
    const parts=l.split(/\[([^\]]*)\]/);let text=parts[0];const chords=[];
    for(let i=1;i<parts.length;i+=2){const sym=parts[i].trim();if(sym)chords.push({pos:text.length,sym});text+=parts[i+1]||""}
    if(chords.length&&!text.trim())return {raw:l};
    return {text,chords};
  });
}
function ceBody(){
  return CE.lines.map(L=>{
    if(L.raw!==undefined)return L.raw;
    const cs=L.chords.slice().sort((a,b)=>a.pos-b.pos);let out="",last=0;
    for(const c of cs){out+=L.text.slice(last,c.pos)+"["+c.sym+"]";last=c.pos}
    return out+L.text.slice(last);
  }).join("\n");
}
function ceUsed(){const seen=[];CE.lines.forEach(L=>{if(L.chords)L.chords.forEach(c=>{if(!seen.includes(c.sym))seen.push(c.sym)})});return seen}
function wordStarts(t){const a=[];for(let i=0;i<t.length;i++)if(t[i]!==" "&&(i===0||t[i-1]===" "))a.push(i);return a}
function ceOpen(body,title,apply){
  if(!String(body||"").trim()){toast("Primero escribe la letra de la canción");return}
  Object.assign(CE,{on:true,lines:ceParse(body),sel:null,selL:-1,cur:null,apply,title:title||"",dirty:false,confirm:false,drag:null});
  $("#ce").hidden=false;document.body.style.overflow="hidden";ceRender();
}
function ceClose(){CE.on=false;CE.drag=null;$("#ce").hidden=true;$("#ce").innerHTML="";document.body.style.overflow=S.stage?"hidden":""}
function ceBarHTML(){
  const sel=CE.sel,used=ceUsed();
  const pal=used.map(x=>`<button class="chip" data-act="cePal" data-s="${esc(x)}">${esc(x)}</button>`).join("");
  const custom=`<input type="text" id="ceCustom" placeholder="otro" maxlength="12" aria-label="Otro acorde" style="width:84px"><button class="btn sm" data-act="ceCustom">${sel?"Cambiar":"Añadir"}</button>`;
  if(sel){
    const L=CE.lines[CE.selL],ctx=esc(L.text.slice(Math.max(0,sel.pos-6),sel.pos))+"▸"+esc(L.text.slice(sel.pos,sel.pos+8));
    return `<div class="row" style="gap:6px"><b class="ce-cur">${esc(sel.sym)}</b><span class="muted ce-ctx">…${ctx}</span><span style="margin-left:auto"></span><button class="btn sm" data-act="ceMove" data-d="word-" aria-label="Palabra anterior">⇤</button><button class="btn sm" data-act="ceMove" data-d="-1" aria-label="Un carácter a la izquierda">◀</button><button class="btn sm" data-act="ceMove" data-d="1" aria-label="Un carácter a la derecha">▶</button><button class="btn sm" data-act="ceMove" data-d="word+" aria-label="Palabra siguiente">⇥</button></div>
      <div class="row" style="gap:6px"><span class="label">Cambiar por</span><div class="chips">${pal}</div>${custom}</div>
      <div class="row" style="gap:6px"><button class="btn sm danger" data-act="ceDel">Quitar este acorde</button><button class="btn sm ghost" data-act="ceDesel">Listo</button></div>`;
  }
  if(CE.cur){
    const L=CE.lines[CE.cur.l],ctx=esc(L.text.slice(Math.max(0,CE.cur.i-6),CE.cur.i))+"▸"+esc(L.text.slice(CE.cur.i,CE.cur.i+8));
    return `<div class="row" style="gap:6px"><span class="label">Añadir acorde en</span><span class="ce-ctx">…${ctx}</span></div><div class="row" style="gap:6px"><div class="chips">${pal}</div>${custom}</div>`;
  }
  return `<span class="muted">Toca un acorde para moverlo, o toca una letra para añadir un acorde justo ahí.</span>`;
}
function ceRows(t,W){
  const rows=[];let st=0;const L=t.length;
  while(st<L){let e=Math.min(L,st+W);if(e<L){const k=t.slice(st,e).lastIndexOf(" ");if(k>0)e=st+k+1}rows.push([st,e]);st=e}
  return rows.length?rows:[[0,0]];
}
function ceWidth(){
  const root=$("#ce"),pr=document.createElement("span");pr.className="ce-probe";pr.style.setProperty("--cefs",CE.font+"px");pr.textContent="0000000000";root.appendChild(pr);
  const chPx=pr.getBoundingClientRect().width/10||8;root.removeChild(pr);
  return Math.max(16,Math.floor((root.clientWidth-34)/chPx)-1);
}
function ceRender(){
  const old=$("#ceBody"),keep=old?old.scrollTop:0;const W=ceWidth();
  let html=`<header class="ce-top"><div style="min-width:0"><span class="label">Colocar acordes</span><h2>${esc(CE.title)}</h2></div><div class="row" style="gap:6px"><span class="seg-ctl"><button data-act="ceFont" data-d="-1" aria-label="Letra más pequeña">A−</button><button data-act="ceFont" data-d="1" aria-label="Letra más grande">A+</button></span><button class="btn" data-act="ceCancel">${CE.confirm?"¿Descartar cambios?":"Cancelar"}</button><button class="btn pri" data-act="ceApply">Aplicar</button></div></header>
  <div class="ce-help">Arrastra un acorde hasta la sílaba donde entra, o tócalo y muévelo con las flechas. Para pasarlo a otra fila, toca la letra donde quieres ponerlo.</div><div class="ce-body" id="ceBody" style="--cefs:${CE.font}px">`;
  CE.lines.forEach((L,i)=>{
    if(L.raw!==undefined){html+=!L.raw.trim()?'<div class="ce-gap"></div>':/^\s*#/.test(L.raw)?`<div class="ce-sec">${esc(L.raw.replace(/^\s*#\s*/,""))}</div>`:`<div class="ce-raw">${esc(L.raw)}</div>`;return}
    const len=L.text.length,rows=ceRows(L.text,W);
    html+=`<div class="ce-line">`+rows.map(([a,e],ri)=>{
      const last=ri===rows.length-1,end=last?len:e-1;
      const chips=L.chords.map((c,k)=>({c,k})).filter(x=>x.c.pos>=a&&(last?x.c.pos<=len:x.c.pos<e));
      const cells=[];for(let j=a;j<=(last?len:e-1);j++)cells.push(`<i data-l="${i}" data-i="${j}"${CE.cur&&CE.cur.l===i&&CE.cur.i===j?' class="cur"':""}>${j<len?(L.text[j]===" "?"&nbsp;":esc(L.text[j])):"&nbsp;"}</i>`);
      return `<div class="ce-in" data-a="${a}" data-z="${end}"><div class="ce-chords">${chips.map(x=>`<button class="ce-chip${CE.sel===x.c?" sel":""}" data-l="${i}" data-k="${x.k}" style="--p:${x.c.pos-a}">${esc(x.c.sym)}</button>`).join("")}</div><div class="ce-text">${cells.join("")}</div></div>`;
    }).join("")+`</div>`;
  });
  html+=`</div><footer class="ce-bar" id="ceBar">${ceBarHTML()}</footer>`;
  $("#ce").innerHTML=html;$("#ceBody").scrollTop=keep;
  if(CE.sel){const el=$("#ce .ce-chip.sel");el&&el.scrollIntoView({block:"nearest",inline:"nearest"})}

function ceMoveSel(d){
  const c=CE.sel;if(!c)return;const L=CE.lines[CE.selL],len=L.text.length;let p=c.pos;

  else if(d==="word+"){const w=wordStarts(L.text).filter(x=>x>p);p=w.length?w[0]:len}
  else p+=+d;
  p=Math.max(0,Math.min(len,p));if(p!==c.pos){c.pos=p;CE.dirty=true;CE.confirm=false}ceRender();
}
function ceSetChord(sym){
  sym=String(sym||"").trim();if(!isChord(sym)){toast("No reconozco «"+sym+"» como acorde");return}
  if(CE.sel){CE.sel.sym=sym;CE.dirty=true}
  else if(CE.cur){const L=CE.lines[CE.cur.l],c={pos:CE.cur.i,sym};L.chords.push(c);CE.sel=c;CE.selL=CE.cur.l;CE.cur=null;CE.dirty=true}

}
$("#ce").addEventListener("pointerdown",e=>{
  const chip=e.target.closest(".ce-chip");if(!chip)return;e.preventDefault();
  const l=+chip.dataset.l,c=CE.lines[l].chords[+chip.dataset.k],i0=chip.closest(".ce-in").querySelector(".ce-text i");

$("#ce").addEventListener("pointermove",e=>{
  const d=CE.drag;if(!d)return;const dx=e.clientX-d.x0;if(!d.moved&&Math.abs(dx)<5)return;d.moved=true;

const ceUp=()=>{const d=CE.drag;if(!d)return;CE.drag=null;CE.sel=(!d.moved&&CE.sel===d.c)?null:d.c;CE.selL=d.l;CE.cur=null;ceRender()};

$("#ce").addEventListener("click",e=>{

  metroPlay(){if(Eng.mode==="metro")Eng.stop();else startMetro()},
  mBpm(b){setMetroBpm(S.metro.bpm+ +b.dataset.d)},
  tap(){const now=performance.now();const t=ACT._taps=(ACT._taps||[]).filter(x=>now-x<2500);t.push(now);if(t.length>=2){const iv=[];for(let i=1;i<t.length;i++)iv.push(t[i]-t[i-1]);const avg=iv.slice(-4).reduce((a,b)=>a+b,0)/Math.min(4,iv.length);setMetroBpm(60000/avg)}},
  stToggle(){ST.playing?stStop():stPlay()},
  stDemo:()=>stDemo(),
  stJump(b){stSeek(stPos()+ +b.dataset.d)},
  stA(){if(!ST.src)return;ST.A=stPos();if(ST.B!=null&&ST.B<=ST.A+.1)ST.B=null;stPaintTransport()},
  stB(){if(!ST.src)return;const t=stPos();if(ST.A==null||ST.A>=t-.1)ST.A=0;ST.B=t;if(ST.B>ST.A+.1){ST.loop=true;stSeek(ST.A)}stPaintTransport()},
  stLoop(){ST.loop=!ST.loop;if(ST.playing)stSeek(stPos());stPaintTransport()},
  stClearAB(){ST.A=ST.B=null;ST.loop=false;if(ST.playing)stSeek(stPos());stPaintTransport()},
  stShift(b){if(!ST.src)return;ST.shift=Math.max(-12,Math.min(12,ST.shift+ +b.dataset.d));stPaintTransport();clearTimeout(ACT._sh);ACT._sh=setTimeout(stProcess,450)},
  stShiftReset(){if(!ST.src||!ST.shift)return;ST.shift=0;stPaintTransport();stProcess()},
  stMode(b){if(ST.mode===b.dataset.m)return;ST.mode=b.dataset.m;ST.stems=null;stRenderMixer();stProcess()},
  stMute(b){const m=mixOf(b.dataset.n);m.m=!m.m;stRenderMixer();stApplyGains()},
  stSolo(b){const m=mixOf(b.dataset.n);m.s=!m.s;stRenderMixer();stApplyGains()},
  stQuick(b){const q=b.dataset.q;(ST.stems||[]).forEach(x=>{const m=mixOf(x.name),v=/^voz/i.test(x.name);m.s=false;m.m=q==="novoz"?v:q==="solovoz"?!v:false});stRenderMixer();stApplyGains()},
  async stMyKey(){const id=ST.src&&ST.src.songId;if(!id)return;const so=clone(Store.get("songs",id));delete so.id;so.myShift=ST.shift;delete S.tr[id];await Store.put("songs",id,so).catch(()=>{});stPaintTransport();toast(ST.shift?"Guardado: tu tono es "+fmtSt(ST.shift)+" semitonos":"Vuelves al tono original")},
  stSeeChords(){const id=ST.src&&ST.src.songId;if(!id)return;S.tr[id]=ST.shift;S.songId=id;S.tab="songs";persist();render();window.scrollTo(0,0)},
  stSaveMix:()=>stSaveMix(),
  stSaveStems:()=>stSaveStems(),
  toStudio(b){S.tab="studio";persist();render();window.scrollTo(0,0);if(!ST.src||ST.src.songId!==b.dataset.id)stLoadSong(b.dataset.id)},
  saveWheelRes(){const w=S.wheel;const p=PRESETS.find(x=>x.id===w.preset);resForm(null,{title:p?p.name:"Mi progresión",tag:STYLES[w.style].split(" ")[0],prog:w.prog,key:w.key,style:w.style,bpm:w.bpm,meter:w.meter})},
  resTag(b){S.resTag=b.dataset.t;render()},
  newRes(){resForm(null)},
  editRes(b){resForm(Store.get("resources",b.dataset.id))},
  saveRes(b){saveRes(b.dataset.id)},
  delRes(b){if(b.dataset.armed){Store.del("resources",b.dataset.id);closeModal();render()}else{b.dataset.armed=1;b.textContent="¿Seguro? Pulsa otra vez"}},
  practiceRes(b){const r=Store.get("resources",b.dataset.id);Object.assign(S.wheel,{preset:"custom",prog:r.prog,key:+(r.key||0),style:r.style||"pop",bpm:+r.bpm||100,meter:+r.meter||4});const p=PRESETS.find(x=>x.prog===r.prog);if(p)S.wheel.preset=p.id;S.tab="practice";persist();render();window.scrollTo(0,0)},
  backup:backupModal,
  export:doExport
};
document.addEventListener("click",e=>{const a=e.target.closest("[data-act]");if(!a||a.disabled)return;const f=ACT[a.dataset.act];if(f){e.preventDefault&&a.tagName!=="LABEL"&&e.preventDefault();f(a,e)}});
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){S.q=e.target.value;const pos=e.target.selectionStart;render();const q=$("#q");q.focus();q.setSelectionRange(pos,pos)}
  else if(e.target.id==="lq"){S.lq=e.target.value;const pos=e.target.selectionStart;render();const q=$("#lq");q.focus();q.setSelectionRange(pos,pos)}
});
document.addEventListener("change",async e=>{
  if(e.target.id==="spStyle"||e.target.id==="spLoop"){
    const id=S.songId;if(!id)return;const o=S.sp[id]=S.sp[id]||{};
    if(e.target.id==="spStyle"){o.style=e.target.value;if(SP.on&&SP.id===id)spStart(id)}
    else{o.loop=e.target.checked;if(SP.on&&SP.id===id&&Eng.cfg)Eng.cfg.maxBeats=o.loop?0:Eng.cfg.beatChords.length}
    return;
  }
  if(e.target.id==="setName"){const st=clone(Store.get("sets",S.setId));delete st.id;st.name=e.target.value.trim()||"Set sin nombre";await Store.put("sets",S.setId,st).catch(()=>{})}});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.id==="ceCustom"){ACT.ceCustom();return}
  if(e.key==="Enter"&&e.target.id==="lfNew"){e.preventDefault();lfAddTyped();return}
  if(e.key==="Enter"&&e.target.id==="lgPass"){fbSignIn();return}
  if(CE.on){
    if(e.key==="Escape"){ACT.ceCancel();return}
    if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
    if(CE.sel){if(e.key==="ArrowLeft"){e.preventDefault();ceMoveSel("-1")}else if(e.key==="ArrowRight"){e.preventDefault();ceMoveSel("1")}else if(e.key==="Delete"||e.key==="Backspace"){e.preventDefault();ACT.ceDel()}}
    return;
  }
  if(e.key==="Escape"){if(!$("#modal").hidden)return closeModal();if(S.stage)return closeStage()}
  if(!S.stage&&S.tab==="studio"&&e.key===" "&&!/INPUT|TEXTAREA|SELECT|BUTTON/.test(document.activeElement.tagName)){e.preventDefault();ST.playing?stStop():stPlay();return}
  if(!S.stage||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  const b=$("#stageBody");
  if(e.key==="ArrowRight"){e.preventDefault();stageNav(1)}
  else if(e.key==="ArrowLeft"){e.preventDefault();stageNav(-1)}
  else if(e.key==="PageDown"||e.key==="ArrowDown"){e.preventDefault();if(b.scrollTop+b.clientHeight>=b.scrollHeight-4&&e.key==="PageDown")stageNav(1);else b.scrollBy({top:b.clientHeight*.6,behavior:"smooth"})}
  else if(e.key==="PageUp"||e.key==="ArrowUp"){e.preventDefault();if(b.scrollTop<=2&&e.key==="PageUp")stageNav(-1);else b.scrollBy({top:-b.clientHeight*.6,behavior:"smooth"})}
  else if(e.key===" "){e.preventDefault();const btn=$('#stage [data-act="scroll"]');btn&&ACT.scroll(btn)}
});
let tx=null;$("#stage").addEventListener("touchstart",e=>{tx=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});
$("#stage").addEventListener("touchend",e=>{if(!tx)return;const dx=e.changedTouches[0].clientX-tx[0],dy=e.changedTouches[0].clientY-tx[1];tx=null;if(Math.abs(dx)>90&&Math.abs(dy)<60)stageNav(dx<0?1:-1)},{passive:true});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.stage)lockScreen()});

addEventListener("resize",()=>{if(S.tab==="studio")drawWave()});
render();Store.init().catch(e=>{console.error(e);const m=$("#mode");if(m)m.textContent="Error al iniciar: "+(e&&e.message||e)});
</script>
</body>
</html>
